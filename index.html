<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SOB FINAL - All in One</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box;font-family:sans-serif;margin:0;padding:0}body{background:#eef4ff;padding-bottom:40px}.top{display:flex;justify-content:center;padding:10px;gap:6px;flex-wrap:wrap}.k{background:#e65100;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:800}.n{background:#4a148c;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:800}.p{background:#7c3aed;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:800}.hi{display:flex;justify-content:center;gap:8px;margin:14px 0}h1{text-align:center;font-size:22px;font-weight:900;margin:10px}.sel,.num{margin:10px 14px;background:#fff;border-radius:16px;padding:14px;width:calc(100% - 28px);border:0;box-shadow:0 4px 14px rgba(0,0,0,.08);font-size:16px;display:block}.box{margin:16px 14px;background:#fff;border-radius:20px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.1)}.row{display:flex;justify-content:space-between;padding:8px;font-weight:600}.tot{border:2px solid #facc15;padding:6px 14px;border-radius:12px;font-weight:900;min-width:80px;text-align:center}.sobId{display:flex;margin:16px 14px;background:#fff;border-radius:16px;overflow:hidden}.sobId input{flex:1;border:0;padding:14px}.actions{display:flex;justify-content:center;gap:12px;margin:14px}.bSave{background:#0b56d1;color:#fff;border:0;padding:12px 22px;border-radius:24px;font-weight:800}.bReset{background:#ff8c00;color:#fff;border:0;padding:12px;border-radius:24px;font-weight:800}.prints{display:flex;justify-content:center;gap:8px;margin:10px;flex-wrap:wrap}.pr{background:#fff;border:0;padding:10px 14px;border-radius:20px;box-shadow:0 3px 10px rgba(0,0,0,.1);font-weight:700;font-size:13px}.small{font-size:10px;text-align:center;margin-top:10px;font-weight:600}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.modalBox{background:#fff;width:100%;max-width:950px;max-height:90vh;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.modalHead{display:flex;justify-content:space-between;padding:14px;color:#fff;font-weight:800}.modalBody{overflow:auto;padding:12px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#eef4ff;padding:8px;text-align:left;position:sticky;top:0}td{padding:7px;border-bottom:1px solid #eee}.btnExcel{background:#107c41;color:#fff;border:0;padding:8px 12px;border-radius:8px;font-weight:800;margin:3px;font-size:11px}.btnBlue{background:#1a56db;color:#fff;border:0;padding:8px 12px;border-radius:8px;font-weight:800;margin:3px;font-size:11px}.btnDel{background:#d32f2f;color:#fff;border:0;padding:5px 10px;border-radius:6px;font-weight:700;font-size:11px}.userChip{background:#fff;border:1px solid #1a56db;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;margin:4px;display:inline-block;cursor:pointer}.userInfo{background:#fff;margin:10px 14px;padding:12px;border-radius:12px;text-align:center;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08)}</style></head><body>
<div class="top"><button class="k" onclick="openCat('krishna')">🌍 Krishna Report</button><button class="n" onclick="openCat('nijaatma')">🔱 NAM Report</button><button class="p" onclick="openReport()">📄 All Report + Delete</button></div>
<div class="hi">🌞<b>Hi,</b><input id="userName" style="background:#fff;border:0;border-radius:22px;padding:8px 16px;width:130px;text-align:center;font-weight:700" placeholder="Username"><button onclick="loadUser()" style="background:#1a56db;color:#fff;border:0;border-radius:20px;padding:8px 16px;font-weight:800">Load</button></div>
<div class="userInfo" id="userInfo">Enter username and Load</div>
<h1>SOB coMboS calculator - FINAL</h1>
<select class="sel" id="comboSelect"><option value="">Select Combo</option></select>
<input class="num" id="adults" type="number" placeholder="No. of Adults" min="0"><input class="num" id="children" type="number" placeholder="No. of Children" min="0">
<div class="box"><div class="row"><span>TPU</span><span id="tpu">₹ 0</span></div><div class="row"><span>OEPL</span><span id="oepl">₹ 0</span></div><div class="row"><span>PAEPL</span><span id="paepl">₹ 0</span></div><hr><div class="row"><b>TOTAL</b><div class="tot" id="total">₹ 0</div></div><div id="detail" style="margin-top:8px;font-size:11px;color:#555"></div></div>
<div class="sobId"><input id="sobId" placeholder="Enter 6-digit SOB ID" maxlength="6"></div>
<div class="actions"><button class="bSave" onclick="saveSob()">Save SOB</button><button class="bReset" onclick="resetAll()">Reset</button></div>
<div class="prints"><button class="pr" style="background:#ffecb3" onclick="openCat('krishna')">🌍 Krishna (9 Combos)</button><button class="pr" style="background:#e1bee7" onclick="openCat('nijaatma')">🔱 NAM (6 Combos)</button><button class="pr" onclick="openReport()">📄 All Users + Delete + Print</button></div>
<div class="small">FINAL All-in-One | NAME: <u id="displayName">____</u> | DATE: <span id="date"></span> | Saved: <span id="savedCount">0</span></div>
<div class="modal" id="reportModal"><div class="modalBox"><div class="modalHead" style="background:#1a56db"><span id="modalTitle">All Report</span><span onclick="closeReport()" style="cursor:pointer">✕</span></div><div style="padding:12px;border-bottom:1px solid #eee"><div><span id="userChips"></span></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><input id="searchUser" placeholder="Username search karo" style="padding:9px 12px;border-radius:8px;border:1px solid #ccc;flex:1;min-width:150px"><button class="btnBlue" onclick="doSearch()">View</button><button class="btnBlue" style="background:#666" onclick="doShowAll()">All</button><button class="btnExcel" onclick="exportExcel()">Excel</button><button class="btnBlue" onclick="printReport()">Print</button></div><div id="modalCount" style="margin-top:6px;font-weight:700;font-size:11px"></div></div><div class="modalBody"><table><thead><tr><th>#</th><th>User</th><th>SOB ID</th><th>Combo</th><th>TOTAL</th><th>Delete</th></tr></thead><tbody id="reportTbody"></tbody></table></div></div></div>
<div class="modal" id="catModal"><div class="modalBox"><div class="modalHead" id="catHead"><span id="catTitle">Report</span><span onclick="closeCat()" style="cursor:pointer">✕</span></div><div style="padding:12px;border-bottom:1px solid #eee"><div><span id="catUserChips"></span></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><input id="catSearch" placeholder="Username" style="padding:9px 12px;border-radius:8px;border:1px solid #ccc;flex:1;min-width:150px"><button class="btnBlue" onclick="doCatSearch()">View</button><button class="btnBlue" style="background:#666" onclick="doCatShowAll()">All</button><button class="btnExcel" onclick="exportCat()">Excel</button><button class="btnBlue" onclick="printCat()">Print</button></div><div id="catSummary" style="margin-top:6px;font-weight:700;font-size:11px"></div></div><div class="modalBody"><table><thead><tr><th>User</th><th>Total</th><th id="thCat">Category</th><th>%</th><th>Details</th></tr></thead><tbody id="catTbody"></tbody></table><br><b id="detailTitle"></b><table><thead><tr><th>#</th><th>User</th><th>SOB ID</th><th>Combo</th><th>TOTAL</th><th>Delete</th></tr></thead><tbody id="catDetail"></tbody></table></div></div></div>
<script>
const combos=[{id:1,name:"1. Explorer Combo",tpuA:170,tpuC:80,oeplA:40,paeplA:89,totalA:299,totalC:209},{id:2,name:"2. Eco Adventure Combo",tpuA:170,tpuC:80,oeplA:0,paeplA:227,totalA:397,totalC:307},{id:3,name:"3. Eco Fun Combo",tpuA:170,tpuC:80,oeplA:28,paeplA:200,totalA:398,totalC:308},{id:4,name:"4. Snow Adventure Combo",tpuA:170,tpuC:80,oeplA:255,paeplA:0,totalA:425,totalC:335},{id:5,name:"5. Aastha Combo",tpuA:470,tpuC:400,oeplA:0,paeplA:100,totalA:570,totalC:500},{id:6,name:"6. Adventure Combo",tpuA:170,tpuC:0,oeplA:0,paeplA:529,totalA:699,totalC:null},{id:7,name:"7. Namah Combo",tpuA:650,tpuC:475,oeplA:0,paeplA:50,totalA:700,totalC:525},{id:8,name:"8. Viewing Fun Combo",tpuA:470,tpuC:280,oeplA:155,paeplA:150,totalA:775,totalC:585},{id:9,name:"9. Symbolic Play Combo",tpuA:470,tpuC:280,oeplA:249,paeplA:50,totalA:769,totalC:579},{id:10,name:"10. Ultimate Play Combo",tpuA:170,tpuC:80,oeplA:199,paeplA:520,totalA:889,totalC:799},{id:11,name:"11. Delight Combo",tpuA:470,tpuC:380,oeplA:105,paeplA:350,totalA:925,totalC:835},{id:12,name:"12. Mini Blast Combo",tpuA:670,tpuC:480,oeplA:199,paeplA:100,totalA:969,totalC:779},{id:13,name:"13. All in fun Combo",tpuA:450,tpuC:275,oeplA:200,paeplA:450,totalA:1100,totalC:925},{id:14,name:"14. Divine Rush Combo",tpuA:1450,tpuC:875,oeplA:0,paeplA:100,totalA:1550,totalC:975},{id:15,name:"15. Ultimate Mega Combo",tpuA:1500,tpuC:300,oeplA:449,paeplA:2300,totalA:4249,totalC:null}];
const sel=document.getElementById('comboSelect');combos.forEach(c=>{let o=document.createElement('option');o.value=c.id;o.text=c.name+" - ₹"+c.totalA+(c.totalC?"/₹"+c.totalC:"");sel.add(o);});
let cur={tpu:0,oepl:0,paepl:0,total:0,combo:null,adults:0,children:0};let curCat='krishna';
const KRISHNA_IDS=[5,7,8,9,11,12,13,14,15];const NIJAATMA_IDS=[5,7,11,12,14,15];
function isKrishna(name){let f=combos.find(c=>name.includes(c.name));return f?KRISHNA_IDS.includes(f.id):false;}
function isNijaatma(name){let f=combos.find(c=>name.includes(c.name));return f?NIJAATMA_IDS.includes(f.id):false;}
function checkCat(name,cat){return cat==='krishna'?isKrishna(name):isNijaatma(name);}
function calc(){let id=parseInt(sel.value);let ad=parseInt(document.getElementById('adults').value)||0;let ch=parseInt(document.getElementById('children').value)||0;if(!id){setV(0,0,0,0,"");return;}let co=combos.find(x=>x.id===id);if(co.totalC===null&&ch>0){alert('Child Not Allowed');document.getElementById('children').value=0;return calc();}let tpu=ad*co.tpuA;let oepl=ad*co.oeplA;let paepl=ad*co.paeplA;if(ch>0&&co.totalC!==null){let tpuC=ch*co.tpuC;let rem=ch*co.totalC-tpuC;let adultRem=co.totalA-co.tpuA;let oeRatio=adultRem?co.oeplA/adultRem:0;let oeC=Math.round(rem*oeRatio);let paC=rem-oeC;tpu+=tpuC;oepl+=oeC;paepl+=paC;}let tot=tpu+oepl+paepl;cur={tpu,oepl,paepl,total:tot,combo:co,adults:ad,children:ch};setV(tpu,oepl,paepl,tot,ad+" Ad x ₹"+co.totalA+" + "+ch+" Ch x ₹"+(co.totalC||0));}
function setV(tpu,oepl,paepl,total,det){document.getElementById('tpu').innerText="₹ "+tpu;document.getElementById('oepl').innerText="₹ "+oepl;document.getElementById('paepl').innerText="₹ "+paepl;document.getElementById('total').innerText="₹ "+total;document.getElementById('detail').innerText=det;}
sel.addEventListener('change',calc);document.getElementById('adults').addEventListener('input',calc);document.getElementById('children').addEventListener('input',calc);
function resetAll(){sel.value="";document.getElementById('adults').value="";document.getElementById('children').value="";document.getElementById('sobId').value="";setV(0,0,0,0,"");cur={tpu:0,oepl:0,paepl:0,total:0};}
function getSaved(){try{return JSON.parse(localStorage.getItem('sob_all_data')||'[]');}catch(e){return [];}}function setSaved(a){localStorage.setItem('sob_all_data',JSON.stringify(a));updateUserInfo();}
function loadUser(){let n=document.getElementById('userName').value.trim();if(!n){alert('Username likho');return;}document.getElementById('displayName').innerText=n;localStorage.setItem('sob_user',n);updateUserInfo();}
function updateUserInfo(){let user=document.getElementById('userName').value||localStorage.getItem('sob_user')||"";let all=getSaved();let uniq=[...new Set(all.map(r=>r.user))];if(!user){document.getElementById('userInfo').innerHTML=`Total Users: ${uniq.length} | Total SOB: ${all.length} - Upar se koi bhi report dekho`;document.getElementById('savedCount').innerText=all.length;return;}let my=all.filter(r=>r.user.toLowerCase()===user.toLowerCase());let kr=my.filter(r=>isKrishna(r.combo)).length;let nj=my.filter(r=>isNijaatma(r.combo)).length;document.getElementById('userInfo').innerHTML=`<span style="color:#1a56db">${user}</span> ke <b>${my.length}</b> | 🌍Krishna:${kr} | 🔱NAM:${nj} | All Users:${uniq.length} | Total:${all.length}`;document.getElementById('savedCount').innerText=my.length+" / "+all.length;}
function saveSob(){let sob=document.getElementById('sobId').value.trim();let user=document.getElementById('userName').value||document.getElementById('displayName').innerText||"Unknown";if(user==="____"||user==="Unknown"){alert('Pehle username Load karo');return;}if(sob.length!==6){alert('6-digit SOB ID');return;}if(!sel.value){alert('Combo select karo');return;}if(cur.total===0)calc();let d=getSaved();if(d.some(r=>r.sobId===sob)){alert('Ye SOB ID pehle se save hai!');return;}let e={id:Date.now(),no:d.length+1,date:new Date().toLocaleDateString('en-GB'),time:new Date().toLocaleTimeString(),user:user,sobId:sob,combo:cur.combo?cur.combo.name:"",adults:cur.adults,children:cur.children,total:cur.total};d.push(e);setSaved(d);document.getElementById('sobId').value="";alert('Saved! '+user+' - '+sob);}
function deleteSob(uid){if(!confirm('Delete karna hai?'))return;let all=getSaved();let f=all.filter(r=>r.id!=uid);setSaved(f);alert('Deleted!');if(document.getElementById('reportModal').classList.contains('show'))doSearch();if(document.getElementById('catModal').classList.contains('show'))doCatSearch();}
function getAllUsers(){return [...new Set(getSaved().map(r=>r.user))];}
function renderUserChips(id){let all=getSaved();let users=getAllUsers();let cont=document.getElementById(id);cont.innerHTML="";if(users.length===0){cont.innerHTML="<small>No users yet</small>";return;}users.forEach(u=>{let c=all.filter(r=>r.user===u).length;let s=document.createElement('span');s.className='userChip';s.innerText=u+" ("+c+")";s.onclick=()=>{if(id==='userChips'){document.getElementById('searchUser').value=u;doSearch();}else{document.getElementById('catSearch').value=u;doCatSearch();}};cont.appendChild(s);});}
function openReport(){renderUserChips('userChips');doShowAll();document.getElementById('reportModal').classList.add('show');}
function doSearch(){let all=getSaved();let q=document.getElementById('searchUser').value.trim().toLowerCase();let d=q?all.filter(r=>r.user.toLowerCase().includes(q)):all;fillReport(d,q||'All');}
function doShowAll(){document.getElementById('searchUser').value='';fillReport(getSaved(),'All');}
function fillReport(data,label){let tb=document.getElementById('reportTbody');tb.innerHTML="";data.forEach((r,i)=>{let tr=document.createElement('tr');tr.innerHTML=`<td>${i+1}</td><td><b>${r.user}</b></td><td>${r.sobId}</td><td>${r.combo}</td><td><b>₹${r.total}</b></td><td><button class="btnDel" onclick="deleteSob(${r.id})">🗑️</button></td>`;tb.appendChild(tr);});document.getElementById('modalTitle').innerText=`All Report - ${label} (${data.length})`;document.getElementById('modalCount').innerText=`Total ${data.length} - Delete ke liye dustbin dabao`;}
function closeReport(){document.getElementById('reportModal').classList.remove('show');}
function openCat(cat){curCat=cat;renderUserChips('catUserChips');doCatShowAll();document.getElementById('catModal').classList.add('show');}
function doCatSearch(){let all=getSaved();let q=document.getElementById('catSearch').value.trim().toLowerCase();let filtered=all.filter(r=>checkCat(r.combo,curCat));if(q)filtered=filtered.filter(r=>r.user.toLowerCase().includes(q));fillCat(filtered,q||'All');}
function doCatShowAll(){document.getElementById('catSearch').value='';let all=getSaved();let filtered=all.filter(r=>checkCat(r.combo,curCat));fillCat(filtered,'All');}
function fillCat(filtered,label){let all=getSaved();let usersMap={};all.forEach(r=>{if(!usersMap[r.user])usersMap[r.user]={total:0,cat:0,combos:{}};usersMap[r.user].total++;if(checkCat(r.combo,curCat)){usersMap[r.user].cat++;usersMap[r.user].combos[r.combo]=(usersMap[r.user].combos[r.combo]||0)+1;}});let search=document.getElementById('catSearch').value.trim().toLowerCase();let tb=document.getElementById('catTbody');tb.innerHTML="";Object.keys(usersMap).forEach(u=>{if(search&&!u.toLowerCase().includes(search))return;let s=usersMap[u];if(s.cat>0){let comboStr=Object.keys(s.combos).map(k=>k.replace(' Combo','')+':'+s.combos[k]).join(', ');let perc=s.total?Math.round(s.cat*100/s.total):0;let tr=document.createElement('tr');tr.innerHTML=`<td><b>${u}</b></td><td>${s.total}</td><td style="font-weight:800;color:${curCat==='krishna'?'#e65100':'#4a148c'}">${s.cat}</td><td>${perc}%</td><td>${comboStr}</td>`;tb.appendChild(tr);}});let det=document.getElementById('catDetail');det.innerHTML="";filtered.forEach((r,i)=>{let tr=document.createElement('tr');tr.innerHTML=`<td>${i+1}</td><td><b>${r.user}</b></td><td>${r.sobId}</td><td>${r.combo}</td><td><b>₹${r.total}</b></td><td><button class="btnDel" onclick="deleteSob(${r.id})">🗑️</button></td>`;det.appendChild(tr);});let title=curCat==='krishna'?`🌍 World of Krishna (9 Combos)`:`🔱 NAM (6 Combos)`;document.getElementById('catTitle').innerText=title+` - ${label} (${filtered.length})`;document.getElementById('thCat').innerText=curCat==='krishna'?'Krishna':'NAM';document.getElementById('catHead').style.background=curCat==='krishna'?'#e65100':'#4a148c';document.getElementById('catSummary').innerText=`Showing ${filtered.length} / Total ${all.length}`;document.getElementById('detailTitle').innerText=title+' Detail - '+label;}
function closeCat(){document.getElementById('catModal').classList.remove('show');}
function exportExcel(){let all=getSaved();let q=document.getElementById('searchUser').value.trim().toLowerCase();let d=q?all.filter(r=>r.user.toLowerCase().includes(q)):all;if(!d.length){alert('No data');return;}let wsData=[["No","Date","User","SOB ID","Combo","TOTAL"]];d.forEach(r=>{wsData.push([r.no,r.date,r.user,r.sobId,r.combo,r.total]);});let wb=XLSX.utils.book_new();let ws=XLSX.utils.aoa_to_sheet(wsData);XLSX.utils.book_append_sheet(wb,ws,"Report");XLSX.writeFile(wb,`Report_${q||'All'}.xlsx`);}
function exportCat(){let filtered=getSaved().filter(r=>checkCat(r.combo,curCat));let s=document.getElementById('catSearch').value.trim().toLowerCase();if(s)filtered=filtered.filter(r=>r.user.toLowerCase().includes(s));if(!filtered.length){alert('No data');return;}let wsData=[["No","Date","User","SOB ID","Combo","TOTAL"]];filtered.forEach(r=>{wsData.push([r.no,r.date,r.user,r.sobId,r.combo,r.total]);});let wb=XLSX.utils.book_new();let ws=XLSX.utils.aoa_to_sheet(wsData);XLSX.utils.book_append_sheet(wb,ws,curCat);XLSX.writeFile(wb,`${curCat}_${s||'All'}.xlsx`);}
function printReport(){let tb=document.getElementById('reportTbody').innerHTML;let w=window.open('','','width=900,height=700');w.document.write('<html><body><h3>SOB Report - '+new Date().toLocaleDateString('en-GB')+'</h3><table border=1 style="width:100%;border-collapse:collapse"><tr><th>#</th><th>User</th><th>SOB</th><th>Combo</th><th>TOTAL</th></tr>'+tb+'</table></body></html>');w.document.close();w.print();}
function printCat(){let tb1=document.getElementById('catTbody').innerHTML;let tb2=document.getElementById('catDetail').innerHTML;let w=window.open('','','width=900,height=700');w.document.write('<html><body><h3>'+document.getElementById('catTitle').innerText+'</h3><table border=1 style="width:100%;border-collapse:collapse"><tr><th>User</th><th>Total</th><th>Cat</th><th>%</th><th>Combo Wise</th></tr>'+tb1+'</table><br><table border=1 style="width:100%;border-collapse:collapse"><tr><th>#</th><th>User</th><th>SOB</th><th>Combo</th><th>TOTAL</th></tr>'+tb2+'</table></body></html>');w.document.close();w.print();}
document.getElementById('date').innerText=new Date().toLocaleDateString('en-GB');let sv=localStorage.getItem('sob_user');if(sv){document.getElementById('userName').value=sv;document.getElementById('displayName').innerText=sv;}updateUserInfo();
</script></body></html>
