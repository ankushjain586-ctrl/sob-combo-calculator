<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOB</title><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#eef3fb;padding:10px}.btn{border:none;padding:10px 16px;border-radius:20px;font-weight:800;color:#fff;cursor:pointer}.card{background:#fff;border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 6px 18px #0001}.sel,.inp{width:100%;padding:14px;border-radius:18px;border:none;box-shadow:0 4px 10px #0001;font-weight:700}.row2{display:flex;gap:10px}.box{flex:1;background:#fff;border-radius:18px;padding:10px;text-align:center;box-shadow:0 4px 10px #0001}.box input{width:100%;padding:12px;border-radius:12px;border:1.5px solid #aaa;font-size:20px;font-weight:900;text-align:center}.yellow{background:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 20px #0001}.r{display:flex;justify-content:space-between;font-weight:800;padding:4px 0}.total-badge{background:#fff;border:2px solid #ffd000;padding:6px 16px;border-radius:12px;box-shadow:0 0 18px #ffeb3b}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ccc;padding:6px;text-align:center}th{background:#e8e4ff}.del{border:none;background:#ff1a1a;color:#fff;padding:4px 8px;border-radius:6px;font-weight:800}.user-chip{display:inline-block;background:#6a3be0;color:#fff;padding:6px 12px;border-radius:20px;margin:3px;font-size:12px;font-weight:700;cursor:pointer}.user-chip.active{background:#000;color:#ffe14d}.print-all{border:none;background:#fff;padding:12px 16px;border-radius:22px;font-weight:900;box-shadow:0 4px 10px #0001;min-width:140px}@media print{.no-print{display:none!important} body{background:#fff}}</style></head><body>
<div style="text-align:center;font-size:28px;font-weight:900">SOB coMboS calculator</div>
<div class="card no-print"><input id="username" class="inp" placeholder="Enter Username"><br><br><select class="sel" id="comboSel"><option value="">Select Combo</option><option value="0">Explorer - 299/209</option><option value="1">Eco Adventure - 397/307</option><option value="2">Eco Fun - 398/308</option><option value="3">Snow Adv - 425/335</option><option value="4">Aastha - 570/500</option><option value="5">Adventure - 699/NA</option><option value="6">Namah - 700/525</option><option value="7">Viewing Fun - 775/585</option><option value="8">Symbolic - 769/579</option><option value="9">Ultimate Play - 889/799</option><option value="10">Delight - 925/835</option><option value="11">Mini Blast - 969/779</option><option value="12">All in Fun - 1100/925</option><option value="13">Divine Rush - 1550/975</option><option value="14">Ultimate Mega - 4249/NA</option></select><br><br><div class="row2"><div class="box"><b>Adults</b><input id="adults" type="number" placeholder="0"></div><div class="box"><b>Children</b><input id="children" type="number" placeholder="0"><small id="childMsg" style="color:#c00;font-weight:700"></small></div></div><br><div class="yellow"><div class="r"><span>TPU</span><b id="tpu">₹ 0</b></div><div class="r"><span>Off</span><b id="oepl">₹ 0</b></div><div class="r"><span>Pin</span><b id="paepl">₹ 0</b></div><hr><div class="r"><span>TOTAL</span><b id="total" class="total-badge">₹ 0</b></div></div><br><div style="display:flex;gap:8px"><input id="sobId" class="inp" placeholder="Enter 6-digit SOB ID" maxlength="6" style="flex:1"><button class="btn" style="background:#155fdc" onclick="saveSOB()">SAVE</button></div></div>
<div class="card" id="printArea"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><b id="reportTitle">Daily Report</b><div class="no-print" style="display:flex;gap:8px;align-items:center"><button class="btn" style="background:#000;color:#fff" onclick="window.print()">Print</button><select id="printAll" class="print-all" onchange="selectUser(this.value)"><option value="ALL">ALL ▼</option></select></div></div><div class="no-print" id="todayInfo" style="margin:8px 0;font-weight:800;font-size:12px;background:#e0ffe0;padding:6px 10px;border-radius:8px"></div><div class="no-print" id="userList" style="margin:6px 0"></div><div class="no-print" style="display:flex;gap:6px;margin:8px 0"><button class="btn" style="background:#ff9800" id="historyBtn" onclick="toggleHistory()">Puri History</button><button class="btn" style="background:#0a7e07" onclick="exportExcel()">Excel</button><button class="btn" style="background:#5a2ec0" onclick="loadLive()">Load</button></div><div id="reportTable" style="overflow:auto;margin-top:10px"></div><div id="reportTotal" style="margin-top:12px;font-weight:900;text-align:right"></div></div>
<script>
const API="https://api.npoint.io/86455d8f8fd1e7f18d6c";const DATA=[[170,80,40,89],[170,80,0,227],[170,80,28,200],[170,80,255,0],[470,400,0,100],[170,0,0,529],[650,475,0,50],[470,280,155,150],[470,280,249,50],[170,80,199,520],[470,380,105,350],[670,480,199,100],[450,275,200,450],[1450,875,0,100],[1500,300,449,2300]];const NAMES=["Explorer","Eco Adv","Eco Fun","Snow Adv","Aastha","Adventure","Namah","Viewing Fun","Symbolic","Ultimate Play","Delight","Mini Blast","All in Fun","Divine Rush","Ultimate Mega"];
// IST DATE FIX - ye main fix hai
function getTodayIST(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'})}
let TODAY=getTodayIST();let allData=[],selectedUser="ALL",showHistory=false;
function calc(){let v=comboSel.value;if(v===""){tpu.innerText="₹ 0";oepl.innerText="₹ 0";paepl.innerText="₹ 0";total.innerText="₹ 0";children.disabled=false;return{tot:0}}v=+v;let d=DATA[v];let a=parseInt(adults.value)||0;let childEl=children;if(d[1]==0){childEl.value="";childEl.disabled=true;childMsg.innerText="Child Not Allowed"}else{childEl.disabled=false;childMsg.innerText=""}let c=childEl.disabled?0:(parseInt(childEl.value)||0);let tv=a*d[0]+c*d[1],ov=(a+c)*d[2],pv=(a+c)*d[3],tt=tv+ov+pv;tpu.innerText="₹ "+tv;oepl.innerText="₹ "+ov;paepl.innerText="₹ "+pv;total.innerText="₹ "+tt;return{tot:tt,tpuV:tv,oeplV:ov,paeplV:pv,a,c,idx:v}}
comboSel.addEventListener('change',calc);adults.addEventListener('input',calc);children.addEventListener('input',calc);
function toggleHistory(){showHistory=!showHistory;historyBtn.innerText=showHistory?'Aaj ki Dikhao':'Puri History';buildUserList();filterReport()}
async function loadLive(){try{let r=await fetch(API);allData=await r.json();if(!Array.isArray(allData))allData=[]}catch(e){allData=[]}TODAY=getTodayIST();buildUserList();filterReport()}
function buildUserList(){let base=showHistory?allData:allData.filter(x=>x.dateKey==TODAY);let users=[...new Set(base.map(x=>x.user).filter(Boolean))];let html='<span class="user-chip '+(selectedUser=="ALL"?"active":"")+'" onclick="selectUser(\'ALL\')">ALL ('+base.length+')</span>';users.forEach(u=>{let cnt=base.filter(x=>x.user==u).length;html+='<span class="user-chip '+(selectedUser==u?"active":"")+'" onclick="selectUser(\''+u+'\')">'+u+' ('+cnt+')</span>'});userList.innerHTML=html;todayInfo.innerText=showHistory?'Puri History - '+allData.length+' records | Aaj: '+TODAY:'Aaj: '+TODAY+' - '+base.length+' SOB';let sel=document.getElementById('printAll');sel.innerHTML='<option value="ALL">ALL ▼ ('+base.length+')</option>';users.forEach(u=>{let cnt=base.filter(x=>x.user==u).length;sel.innerHTML+='<option value="'+u+'">'+u+' ('+cnt+')</option>'});sel.value=selectedUser;}
function selectUser(u){selectedUser=u;if(u!="ALL")username.value=u;buildUserList();filterReport()}
function getFiltered(){let f=showHistory?allData:allData.filter(x=>x.dateKey==TODAY);if(selectedUser!="ALL")f=f.filter(x=>x.user==selectedUser);return f}
function filterReport(){let filtered=getFiltered();if(!filtered.length){reportTable.innerHTML=showHistory?"Koi record nahi":'Aaj ('+TODAY+') ki koi report nahi - Puri History dekho';reportTotal.innerText="";reportTitle.innerText='Report: '+selectedUser;return}if(selectedUser=="ALL"){let users=[...new Set(filtered.map(x=>x.user))];let html="";let grand={t:0,o:0,p:0,tot:0};users.forEach(u=>{let uData=filtered.filter(x=>x.user==u);let s={t:0,o:0,p:0,tot:0};uData.forEach(r=>{s.t+=+r.tpu||0;s.o+=+r.oepl||0;s.p+=+r.paepl||0;s.tot+=+r.total||0});grand.t+=s.t;grand.o+=s.o;grand.p+=s.p;grand.tot+=s.tot;html+='<div style="margin-top:10px;padding:8px;background:#000;color:#ffe14d;border-radius:10px;font-weight:900;font-size:12px">'+u+' - '+uData.length+' SOB | TPU '+s.t+' | Off '+s.o+' | Pin '+s.p+' | TOTAL Rs '+s.tot+'</div><table><tr><th>SOB ID</th><th>Combo</th><th>Ad/Ch</th><th>TPU</th><th>Off</th><th>Pin</th><th>Total</th><th class="no-print">Del</th></tr>';uData.slice().reverse().forEach(r=>{html+='<tr><td>'+r.sobId+'</td><td>'+r.combo+'</td><td>'+r.adults+'/'+r.children+'</td><td>'+(r.tpu||0)+'</td><td>'+(r.oepl||0)+'</td><td>'+(r.paepl||0)+'</td><td><b>'+r.total+'</b></td><td class="no-print"><button class="del" onclick="deleteSOB(\''+r.id+'\')">X</button></td></tr>'});html+='</table>'});reportTable.innerHTML=html;reportTotal.innerHTML='TPU: ₹ '+grand.t+' | Off: ₹ '+grand.o+' | Pin: ₹ '+grand.p+' | GRAND TOTAL: ₹ '+grand.tot;reportTitle.innerText='Report: ALL - '+filtered.length+' SOB';return}let h='<table><tr><th>SOB ID</th><th>Combo</th><th>Ad/Ch</th><th>TPU</th><th>Off</th><th>Pin</th><th>Total</th><th class="no-print">Del</th></tr>';let sumT=0,sumO=0,sumP=0,sumA=0;filtered.slice().reverse().forEach(r=>{sumT+=+r.tpu||0;sumO+=+r.oepl||0;sumP+=+r.paepl||0;sumA+=+r.total||0;h+='<tr><td>'+r.sobId+'</td><td>'+r.combo+'</td><td>'+r.adults+'/'+r.children+'</td><td>'+(r.tpu||0)+'</td><td>'+(r.oepl||0)+'</td><td>'+(r.paepl||0)+'</td><td><b>'+r.total+'</b></td><td class="no-print"><button class="del" onclick="deleteSOB(\''+r.id+'\')">X</button></td></tr>'});h+='</table>';reportTable.innerHTML=h;reportTotal.innerHTML='TPU: ₹ '+sumT+' | Off: ₹ '+sumO+' | Pin: ₹ '+sumP+' | TOTAL: ₹ '+sumA;reportTitle.innerText='Report: '+selectedUser+' - '+filtered.length+' SOB'}
async function saveSOB(){let u=username.value.trim();if(!u)return alert("Username likho");let sid=sobId.value.trim();if(sid.length!=6)return alert("6 Digit ID");let c=calc();if(c.tot==0)return alert("Combo select karo");let childVal=children.disabled?"NA":c.c;TODAY=getTodayIST();let rec={id:Date.now().toString(),user:u,sobId:sid,combo:NAMES[c.idx],adults:c.a,children:childVal,tpu:c.tpuV,oepl:c.oeplV,paepl:c.paeplV,total:c.tot,date:new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}),dateKey:TODAY};try{let r=await fetch(API);let old=await r.json();if(Array.isArray(old))allData=old}catch(e){}if(!Array.isArray(allData))allData=[];allData.push(rec);await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(allData)});alert("SAVE - "+sid+" ("+TODAY+")");sobId.value="";adults.value="";children.value="";calc();selectedUser=u;buildUserList();filterReport();}
async function deleteSOB(id){if(!confirm("DELETE?"))return;allData=allData.filter(x=>x.id!=id);await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(allData)});buildUserList();filterReport()}
function exportExcel(){let f=getFiltered();if(!f.length)return alert("No data");let rows=[["SOB ID","User","Combo","Ad","Ch","TPU","Off","Pin","TOTAL","Date"]];f.forEach(r=>rows.push([r.sobId,r.user,r.combo,r.adults,r.children,r.tpu||0,r.oepl||0,r.paepl||0,r.total,r.date]));let csv=rows.map(r=>r.map(v=>'"'+v+'"').join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download='SOB_'+TODAY+'.csv';a.click()}
calc();loadLive();
</script></body></html>
