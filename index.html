<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOB Combo Calculator - New</title>
<style>
/* --- PEHLI WALI KA SAME DESIGN --- */
body{font-family: 'Segoe UI', sans-serif;background:#f5f7fb;margin:0;padding:15px}
.container{max-width:900px;margin:auto;background:#fff;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);padding:20px}
h1{text-align:center;color:#0d47a1;margin-bottom:5px}
.sub{text-align:center;color:#666;margin-bottom:20px}
.combo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.combo-card{border:1px solid #ddd;border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;background:#fafafa}
.combo-card.active{border-color:#0d47a1;background:#e3f2fd}
.combo-info b{font-size:16px}
.combo-info span{display:block;font-size:13px;color:#555}
.combo-card button{background:#0d47a1;color:#fff;border:none;padding:7px 12px;border-radius:6px;cursor:pointer}
.summary{margin-top:20px;background:#f0f4ff;border-radius:10px;padding:15px}
.summary h3{margin:0 0 10px}
.split-box{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #ccc;font-size:14px}
.total{font-weight:bold;font-size:18px;text-align:right;margin-top:10px;color:#0d47a1}
</style>
</head>
<body>
<div class="container">
<h1>SOB COMBO</h1>
<p class="sub">Select Combo - Auto Split Calculation</p>

<div class="combo-grid" id="comboGrid"></div>

<div class="summary">
<h3>Selected Combo: <span id="selectedName">None</span></h3>
<div id="splitList"></div>
<div class="total" id="totalAmount">Total: 0 Rs</div>
</div>
</div>

<script>
// --- NEW COMBO DATA - DUSRI WALI LINK SE (Yahi aapko rakhna hai) ---
// Agar amount change karna ho to bas yahi edit karo
const combos = [
  { id: 1, name: "Basic Combo", price: 400, split: { "Park Entry": 150, "SOB": 250 } },
  { id: 2, name: "Snow Park Combo", price: 650, split: { "Park Entry": 150, "Snow Park": 250, "SOB": 250 } },
  { id: 3, name: "Full Enjoy Combo", price: 850, split: { "Park Entry": 150, "Snow Park": 250, "Museum + Village": 200, "SOB": 250 } },
  { id: 4, name: "Snow + SOB Only", price: 500, split: { "Snow Park": 250, "SOB": 250 } },
  // Aap apne new combos yaha add kar sakte ho
];

let selected = null;
const grid = document.getElementById('comboGrid');
const selectedName = document.getElementById('selectedName');
const splitList = document.getElementById('splitList');
const totalAmount = document.getElementById('totalAmount');

function render(){
  grid.innerHTML = "";
  combos.forEach(c=>{
    const div = document.createElement('div');
    div.className = 'combo-card' + (selected && selected.id===c.id ? ' active':'');
    div.innerHTML = `<div class="combo-info"><b>${c.name}</b><span>Price: ${c.price} Rs</span></div><button onclick="selectCombo(${c.id})">Select</button>`;
    grid.appendChild(div);
  });
}

function selectCombo(id){
  selected = combos.find(c=>c.id===id);
  selectedName.innerText = selected.name;
  splitList.innerHTML = "";
  Object.entries(selected.split).forEach(([k,v])=>{
    splitList.innerHTML += `<div class="split-box"><span>${k}</span><span>${v} Rs</span></div>`;
  });
  totalAmount.innerText = "Total: " + selected.price + " Rs";
  render();
}

render();
</script>
</body>
</html>
