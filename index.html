<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOB - Final Dynamic</title>
<style>
body{font-family:Arial;padding:12px;background:#f5f7fb;margin:0}
h3{text-align:center;color:#1a2a4a}
.card{background:white;padding:12px;border-radius:10px;margin:10px 0;box-shadow:0 2px 5px #ccc}
input{width:70px;padding:7px;text-align:center;border:2px solid #1a2a4a;border-radius:6px;font-size:14px;background:#fff}
input::placeholder{color:#fff}
select{padding:6px;border-radius:5px;border:1px solid #666;font-size:11px;width:125px}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eee;gap:4px}
label{font-size:12px;flex:1}
textarea{width:100%;height:380px;font-size:14px;padding:10px;border-radius:8px;border:1px solid #999;box-sizing:border-box}
button{padding:10px;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.btn-main{width:100%;padding:13px;background:#1a2a4a;color:white;font-size:16px;margin-top:8px}
.btn-add{width:100%;background:#ff9800;color:white;margin-top:8px;padding:10px}
.btn-del{background:#d32f2f;color:white;padding:3px 8px;font-size:11px}
.btn-green{width:100%;background:#0f7a3d;color:white;margin-top:8px;padding:13px;font-size:16px}
</style>
</head>
<body>
<h3>Today's Operations Summary</h3>

<div class="card">
<b>1. Ticket Plaza (TOTAL Only) - Blank</b>
<div class="row"><label>Park Entry</label><input id="pe" type="number" value="" placeholder=""></div>
<div class="row"><label>Viewing Gallery</label><input id="vg" type="number" value="" placeholder=""></div>
<div class="row"><label>VG 2nd</label><input id="vg2" type="number" value="" placeholder=""></div>
<div class="row"><label>VG + NAM</label><input id="vgn" type="number" value="" placeholder=""></div>
<div class="row"><label>Nij Manthan</label><input id="nij" type="number" value="" placeholder=""></div>
<div class="row"><label>VG+NAM+NAA</label><input id="vgnnaa" type="number" value="" placeholder=""></div>
<div class="row"><label>VG+NAA</label><input id="vgnaa" type="number" value="" placeholder=""></div>
<div class="row"><label>VG Express</label><input id="exp" type="number" value="" placeholder=""></div>
</div>

<div class="card" style="background:#ffe0b2">
<b>2. Upgrade Counter - Jitne bhi ho Add kar lo</b>
<div id="upgradeList"></div>
<button class="btn-add" onclick="addUpgrade()">+ Add More Upgrade</button>
<p style="font-size:10px;color:#666;margin:5px 0">Select karo: Kaunsi ticket se kaunsi me upgrade hua</p>
</div>

<button class="btn-main" onclick="makeReport()">Generate Final Report</button>

<div class="card">
<textarea id="finalText"></textarea>
<button class="btn-green" onclick="share()">Copy & WhatsApp Share</button>
<button style="width:100%;background:#888;color:white;margin-top:6px" onclick="clearAll()">Clear All</button>
</div>

<script>
const tickets = ["Park Entry","Viewing Gallery","VG 2nd","VG+NAM","Nij Manthan","VG+NAM+NAA","VG+NAA","VG Express"];
const ticketIds = ["pe","vg","vg2","vgn","nij","vgnnaa","vgnaa","exp"];
let upgradeCount = 0;

function addUpgrade(from=0,to=1){
 let div = document.createElement('div');
 div.className='row';
 div.id='up_'+upgradeCount;
 let fromOpts = tickets.map((t,i)=>`<option value="${i}" ${i==from?'selected':''}>${t}</option>`).join('');
 let toOpts = tickets.map((t,i)=>`<option value="${i}" ${i==to?'selected':''}>${t}</option>`).join('');
 div.innerHTML = `<select id="from_${upgradeCount}">${fromOpts}</select> -> <select id="to_${upgradeCount}">${toOpts}</select> <input id="upval_${upgradeCount}" type="number" value="" placeholder="" style="width:55px"> <button class="btn-del" onclick="document.getElementById('up_${upgradeCount}').remove()">X</button>`;
 document.getElementById('upgradeList').appendChild(div);
 upgradeCount++;
}

function v(id){return parseInt(document.getElementById(id)?.value)||0}

function makeReport(){
 let plazaVals = ticketIds.map(id=>v(id));
 let finalVals = [...plazaVals];

 // Apply all upgrades
 for(let i=0;i<upgradeCount;i++){
  let fromEl = document.getElementById(`from_${i}`);
  let toEl = document.getElementById(`to_${i}`);
  let valEl = document.getElementById(`upval_${i}`);
  if(!fromEl||!toEl||!valEl) continue;
  let up = parseInt(valEl.value)||0;
  if(up==0) continue;
  let from = parseInt(fromEl.value);
  let to = parseInt(toEl.value);
  finalVals[from] -= up;
  finalVals[to] += up;
 }

 let today = new Date().toLocaleDateString('en-GB').replace(/\//g,'-');
 let text = `Today's Operations Summary.  DATE :- ${today} \n\nViewing Gallery = ${finalVals[1]}\n\nViewing Gallery + Nij Aatma Manthan = ${finalVals[3]}\n\nNij Aatma Abhishek = ${finalVals[6]}\n\nViewing Gallery + Nij Aatma Abhishek + Nij Aatma Manthan = ${finalVals[5]}\n\nNij Aatma Manthan = ${finalVals[4]}\n\nPark Entry = ${finalVals[0]}\n\nViewing Gallery Express:- ${finalVals[7]}\n\nViewing Gallery (2nd) = ${finalVals[2]}\n\nTotal Footfall = ${finalVals.reduce((a,b)=>a+b,0)}`;
 document.getElementById('finalText').value=text;
}

function share(){
 let t=document.getElementById('finalText').value;
 if(!t) makeReport();
 t=document.getElementById('finalText').value;
 navigator.clipboard.writeText(t);
 window.open("https://wa.me/?text="+encodeURIComponent(t),'_blank');
}
function clearAll(){
 document.querySelectorAll('input').forEach(i=>i.value='');
 document.getElementById('finalText').value='';
}

// Start with 5 blank upgrade rows for your current pattern
addUpgrade(0,1); // PARK->VG
addUpgrade(1,3); // VG->NAM
addUpgrade(0,4); // PARK->Nij
addUpgrade(3,5); // NAM->NAA
addUpgrade(0,3); // PARK->NAM
</script>
</body>
</html>
