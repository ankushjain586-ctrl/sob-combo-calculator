<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOB - Adult Child Final</title>
<style>
body{font-family:Arial;padding:8px;background:#f5f7fb;margin:0;font-size:12px}
h3{text-align:center;color:#1a2a4a;margin:6px}
.card{background:white;padding:8px;border-radius:10px;margin:8px 0;box-shadow:0 2px 5px #ccc}
table{width:100%;border-collapse:collapse}
th{background:#1a2a4a;color:white;padding:5px;font-size:11px}
td{padding:4px;border:1px solid #ddd;text-align:center}
input{width:50px;padding:5px;text-align:center;border:1.5px solid #1a2a4a;border-radius:5px;font-size:13px}
input::placeholder{color:#fff}
.total{font-weight:bold;background:#fff9c4;min-width:30px}
select{font-size:10px;width:90px;padding:3px}
button{padding:8px;border:none;border-radius:6px;cursor:pointer}
.btn-main{width:100%;padding:12px;background:#1a2a4a;color:white;font-size:15px;margin-top:8px}
.btn-add{width:100%;background:#ff9800;color:white;margin-top:6px;padding:9px}
.btn-del{background:#d32f2f;color:white;padding:2px 6px;font-size:10px}
textarea{width:100%;height:350px;font-size:13px;padding:8px;box-sizing:border-box}
</style>
</head>
<body>
<h3>Today's Operations Summary - A/C</h3>

<div class="card">
<b>1. Ticket Plaza - Adult / Child alag</b>
<table id="plazaTable">
<tr><th>Ticket</th><th>Adult</th><th>Child</th><th>Total</th></tr>
</table>
</div>

<div class="card" style="background:#ffe0b2">
<b>2. Upgrade Counter - Adult / Child + Add Button</b>
<table id="upTable">
<tr><th>From -> To</th><th>A</th><th>C</th><th>Tot</th><th>X</th></tr>
</table>
<button class="btn-add" onclick="addUpRow()">+ Add More Upgrade</button>
</div>

<button class="btn-main" onclick="makeReport()">Generate Final Report</button>

<div class="card">
<textarea id="finalText"></textarea>
<button class="btn-main" style="background:#0f7a3d" onclick="share()">WhatsApp Share</button>
<button style="width:100%;background:#888;color:white;margin-top:5px" onclick="clearAll()">Clear All</button>
</div>

<script>
const tickets = ["Park Entry","Viewing Gallery","VG 2nd","VG+NAM","Nij Manthan","VG+NAM+NAA","VG+NAA","VG Express"];
const plazaIds = ["pe","vg","vg2","vgn","nij","vgnnaa","vgnaa","exp"];
let upCount=0;

function initPlaza(){
 let html="";
 tickets.forEach((t,i)=>{
  html+=`<tr><td style="text-align:left;font-size:11px">${t}</td><td><input id="${plazaIds[i]}_a" type="number" value="" placeholder="" oninput="calcTotals()"></td><td><input id="${plazaIds[i]}_c" type="number" value="" placeholder="" oninput="calcTotals()"></td><td id="${plazaIds[i]}_t" class="total">0</td></tr>`;
 });
 document.getElementById('plazaTable').innerHTML+=html;
}

function addUpRow(from=0,to=1){
 let id=upCount;
 let fromOpts=tickets.map((t,i)=>`<option value="${i}" ${i==from?'selected':''}>${t}</option>`).join('');
 let toOpts=tickets.map((t,i)=>`<option value="${i}" ${i==to?'selected':''}>${t}</option>`).join('');
 let tr=document.createElement('tr');
 tr.id='uprow_'+id;
 tr.innerHTML=`<td><select id="from_${id}">${fromOpts}</select>-><select id="to_${id}">${toOpts}</select></td><td><input id="up_${id}_a" type="number" value="" placeholder="" oninput="calcTotals()"></td><td><input id="up_${id}_c" type="number" value="" placeholder="" oninput="calcTotals()"></td><td id="up_${id}_t" class="total">0</td><td><button class="btn-del" onclick="document.getElementById('uprow_${id}').remove();calcTotals()">X</button></td>`;
 document.getElementById('upTable').appendChild(tr);
 upCount++;
}

function vi(id){return parseInt(document.getElementById(id)?.value)||0}

function calcTotals(){
 // Plaza totals
 plazaIds.forEach(pid=>{
  let a=vi(pid+'_a'), c=vi(pid+'_c');
  document.getElementById(pid+'_t').innerText=a+c;
 });
 // Upgrade totals
 for(let i=0;i<upCount;i++){
  let a=vi(`up_${i}_a`), c=vi(`up_${i}_c`);
  let el=document.getElementById(`up_${i}_t`);
  if(el) el.innerText=a+c;
 }
}

function makeReport(){
 calcTotals();
 let plazaVals = plazaIds.map(pid=> vi(pid+'_a')+vi(pid+'_c'));
 let finalVals = [...plazaVals];

 for(let i=0;i<upCount;i++){
  let fromEl=document.getElementById(`from_${i}`);
  let toEl=document.getElementById(`to_${i}`);
  if(!fromEl||!toEl) continue;
  let up = (vi(`up_${i}_a`)+vi(`up_${i}_c`));
  if(up==0) continue;
  finalVals[parseInt(fromEl.value)] -= up;
  finalVals[parseInt(toEl.value)] += up;
 }

 let today=new Date().toLocaleDateString('en-GB').replace(/\//g,'-');
 let text=`Today's Operations Summary.  DATE :- ${today} \n\nViewing Gallery = ${finalVals[1]}\n\nViewing Gallery + Nij Aatma Manthan = ${finalVals[3]}\n\nNij Aatma Abhishek = ${finalVals[6]}\n\nViewing Gallery + Nij Aatma Abhishek + Nij Aatma Manthan = ${finalVals[5]}\n\nNij Aatma Manthan = ${finalVals[4]}\n\nPark Entry = ${finalVals[0]}\n\nViewing Gallery Express:- ${finalVals[7]}\n\nViewing Gallery (2nd) = ${finalVals[2]}\n\nTotal Footfall = ${finalVals.reduce((a,b)=>a+b,0)}`;
 document.getElementById('finalText').value=text;
}

function share(){
 makeReport();
 let t=document.getElementById('finalText').value;
 navigator.clipboard.writeText(t);
 window.open("https://wa.me/?text="+encodeURIComponent(t),'_blank');
}
function clearAll(){
 document.querySelectorAll('input').forEach(i=>i.value='');
 document.querySelectorAll('.total').forEach(e=>e.innerText='0');
 document.getElementById('finalText').value='';
}

initPlaza();
addUpRow(0,1); addUpRow(1,3); addUpRow(0,4); addUpRow(3,5); addUpRow(0,3);
</script>
</body>
</html>
