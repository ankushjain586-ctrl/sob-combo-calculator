<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOB Combo Calculator</title>
  <style>
    :root {
      --bg: #edf3fb;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #5d6b82;
      --line: #dfe6f0;
      --primary: #224a7c;
      --primary-2: #1d3d6a;
      --accent: #f4b942;
      --success: #1da66d;
      --shadow: 0 12px 28px rgba(25, 40, 60, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #f3f7fb 0%, #eef4fb 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }
    .page {
      max-width: 980px;
      margin: 28px auto;
      padding: 24px 18px 40px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 24px;
    }
    h1 {
      margin: 0 0 18px;
      font-size: clamp(1.7rem, 3vw, 2.5rem);
      text-align: center;
      color: var(--primary);
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--muted);
    }
    select, input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    select:focus, input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(34, 74, 124, 0.12);
    }
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .three-col {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }
    .summary {
      margin-top: 8px;
      background: #f7faff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 20px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
    }
    .row:last-child {
      border-bottom: none;
    }
    .total {
      margin-top: 10px;
      padding-top: 10px;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .highlight {
      display: inline-block;
      background: #fff7d8;
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 6px 12px;
      color: #3a3106;
      font-size: 1.1rem;
    }
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 140px;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background: var(--primary-2);
      box-shadow: 0 4px 12px rgba(34, 74, 124, 0.3);
    }
    .btn-secondary {
      background: var(--success);
      color: white;
    }
    .btn-secondary:hover {
      background: #16884d;
      box-shadow: 0 4px 12px rgba(29, 166, 109, 0.3);
    }
    .note {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }
    @media print {
      body {
        background: white;
      }
      .page {
        margin: 0;
        padding: 20px;
      }
      .card {
        box-shadow: none;
        border: 1px solid #ccc;
      }
      .button-group {
        display: none;
      }
      .note {
        display: none;
      }
    }
    @media (max-width: 640px) {
      .two-col { grid-template-columns: 1fr; }
      .three-col { grid-template-columns: 1fr; }
      .page { padding: 14px; }
      .card { padding: 18px 14px; }
      .button-group {
        flex-direction: column;
      }
      button {
        min-width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>SOB Combo Calculator</h1>

      <div class="three-col">
        <div class="field">
          <label for="username">User Name</label>
          <input id="username" type="text" placeholder="Enter your name" />
        </div>
        <div class="field">
          <label for="date">Date</label>
          <input id="date" type="date" />
        </div>
        <div class="field">
          <label for="notes">Notes/Reference</label>
          <input id="notes" type="text" placeholder="Add notes (optional)" />
        </div>
      </div>

      <div class="field">
        <label for="combo">Select Combo</label>
        <select id="combo">
          <option value="">Choose a combo</option>
          <option value="1">Explorer Combo — ₹299 / ₹209</option>
          <option value="2">Eco Adventure Combo — ₹397 / ₹307</option>
          <option value="3">Eco Fun Combo — ₹398 / ₹308</option>
          <option value="4">Snow Adventure Combo — ₹425 / ₹335</option>
          <option value="5">Aastha Combo — ₹570 / ₹500</option>
          <option value="6">Adventure Combo — ₹699 / NA</option>
          <option value="7">Namah Combo — ₹700 / ₹525</option>
          <option value="8">Viewing Fun Combo — ₹775 / ₹585</option>
          <option value="9">Symbolic Play Combo — ₹769 / ₹579</option>
          <option value="10">Ultimate Play Combo — ₹889 / ₹799</option>
          <option value="11">Delight Combo — ₹925 / ₹835</option>
          <option value="12">Mini Blast Combo — ₹969 / ₹779</option>
          <option value="13">All in fun Combo — ₹1100 / ₹925</option>
          <option value="14">Divine Rush Combo — ₹1550 / ₹975</option>
          <option value="15">Ultimate Mega Combo — ₹4249 / NA</option>
        </select>
      </div>

      <div class="two-col">
        <div class="field">
          <label for="adults">Adults</label>
          <input id="adults" type="number" min="0" value="1" />
        </div>
        <div class="field">
          <label for="children">Children</label>
          <input id="children" type="number" min="0" value="0" />
        </div>
      </div>

      <div class="summary">
        <div class="row"><span>TPU</span><span id="tpuDisplay">₹0</span></div>
        <div class="row"><span>OEPL</span><span id="oeplDisplay">₹0</span></div>
        <div class="row"><span>PAEPL</span><span id="paeplDisplay">₹0</span></div>
        <div class="row total"><span>Total</span><span class="highlight" id="totalDisplay">₹0</span></div>
      </div>

      <div class="button-group">
        <button class="btn-primary" type="button" onclick="printSheet()">🖨️ Print Sheet</button>
        <button class="btn-secondary" type="button" onclick="resetForm()">↻ Reset Form</button>
      </div>

      <div class="note">Formula used: Adult TPU and Child TPU are calculated separately, and OEPL/PAEPL are applied per total guest count.</div>
    </div>
  </div>

  <script>
    document.getElementById('date').valueAsDate = new Date();

    const COMBOS = {
      1: { adult: 299, child: 209, oepl: 40, paepl: 89 },
      2: { adult: 397, child: 307, oepl: 0, paepl: 227 },
      3: { adult: 398, child: 308, oepl: 28, paepl: 200 },
      4: { adult: 425, child: 335, oepl: 255, paepl: 0 },
      5: { adult: 570, child: 500, oepl: 0, paepl: 100 },
      6: { adult: 699, child: 0, oepl: 0, paepl: 529 },
      7: { adult: 700, child: 525, oepl: 0, paepl: 50 },
      8: { adult: 775, child: 585, oepl: 155, paepl: 150 },
      9: { adult: 769, child: 579, oepl: 249, paepl: 50 },
      10: { adult: 889, child: 799, oepl: 199, paepl: 520 },
      11: { adult: 925, child: 835, oepl: 105, paepl: 350 },
      12: { adult: 969, child: 779, oepl: 199, paepl: 100 },
      13: { adult: 1100, child: 925, oepl: 200, paepl: 450 },
      14: { adult: 1550, child: 975, oepl: 0, paepl: 100 },
      15: { adult: 4249, child: 0, oepl: 449, paepl: 2300 }
    };

    function formatMoney(value) {
      return '₹' + Number(value).toLocaleString('en-IN');
    }

    function calculate() {
      const comboId = document.getElementById('combo').value;
      const adults = Number(document.getElementById('adults').value || 0);
      const children = Number(document.getElementById('children').value || 0);

      if (!comboId || !COMBOS[comboId]) {
        document.getElementById('tpuDisplay').textContent = '₹0';
        document.getElementById('oeplDisplay').textContent = '₹0';
        document.getElementById('paeplDisplay').textContent = '₹0';
        document.getElementById('totalDisplay').textContent = '₹0';
        return;
      }

      const combo = COMBOS[comboId];
      const totalGuests = adults + children;
      const tpu = (combo.adult * adults) + (combo.child * children);
      const oepl = combo.oepl * totalGuests;
      const paepl = combo.paepl * totalGuests;
      const total = tpu + oepl + paepl;

      document.getElementById('tpuDisplay').textContent = formatMoney(tpu);
      document.getElementById('oeplDisplay').textContent = formatMoney(oepl);
      document.getElementById('paeplDisplay').textContent = formatMoney(paepl);
      document.getElementById('totalDisplay').textContent = formatMoney(total);
    }

    function printSheet() {
      const username = document.getElementById('username').value || 'Guest';
      const date = document.getElementById('date').value || 'N/A';
      const notes = document.getElementById('notes').value || 'N/A';
      const comboSelect = document.getElementById('combo');
      const comboName = comboSelect.options[comboSelect.selectedIndex]?.text || 'No combo selected';
      const adults = document.getElementById('adults').value || '0';
      const children = document.getElementById('children').value || '0';
      const tpu = document.getElementById('tpuDisplay').textContent;
      const oepl = document.getElementById('oeplDisplay').textContent;
      const paepl = document.getElementById('paeplDisplay').textContent;
      const total = document.getElementById('totalDisplay').textContent;

      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>SOB Combo Calculator - Print Sheet</title>
          <style>
            body { font-family: Arial, sans-serif; padding: 30px; background: white; }
            .container { max-width: 700px; margin: 0 auto; border: 2px solid #224a7c; border-radius: 10px; padding: 24px; }
            .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #224a7c; padding-bottom: 12px; }
            .header h1 { margin: 0; color: #224a7c; font-size: 24px; }
            .info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin-bottom: 20px; }
            .info-item { border-bottom: 1px solid #dfe6f0; padding-bottom: 8px; }
            .info-label { font-weight: 700; color: #5d6b82; font-size: 12px; text-transform: uppercase; }
            .info-value { margin-top: 4px; font-size: 15px; }
            .combo-box { background: #f7faff; border-left: 4px solid #224a7c; padding: 14px; border-radius: 8px; }
            .combo-name { font-weight: 700; color: #224a7c; margin-bottom: 10px; }
            .summary-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
            .summary-table td { padding: 8px 10px; border-bottom: 1px solid #dfe6f0; }
            .summary-table td:first-child { font-weight: 700; color: #5d6b82; }
            .summary-table td:last-child { text-align: right; font-weight: 700; }
            .summary-table .total-row { background: #fff7d8; }
            .footer { margin-top: 20px; text-align: center; font-size: 12px; color: #5d6b82; border-top: 1px solid #dfe6f0; padding-top: 10px; }
          </style>
        </head>
        <body>
          <div class="container">
            <div class="header">
              <h1>SOB Combo Calculator</h1>
              <div>Calculation Sheet</div>
            </div>

            <div class="info">
              <div class="info-item"><div class="info-label">User Name</div><div class="info-value">${username}</div></div>
              <div class="info-item"><div class="info-label">Date</div><div class="info-value">${date}</div></div>
              <div class="info-item" style="grid-column: 1 / -1;"><div class="info-label">Notes / Reference</div><div class="info-value">${notes}</div></div>
            </div>

            <div class="combo-box">
              <div class="combo-name">${comboName}</div>
              <div>Adults: ${adults} &nbsp;|&nbsp; Children: ${children}</div>

              <table class="summary-table">
                <tr><td>TPU</td><td>${tpu}</td></tr>
                <tr><td>OEPL</td><td>${oepl}</td></tr>
                <tr><td>PAEPL</td><td>${paepl}</td></tr>
                <tr class="total-row"><td>Total</td><td>${total}</td></tr>
              </table>
            </div>

            <div class="footer">
              Printed on: ${new Date().toLocaleString('en-IN')}<br>
              Formula: Adult TPU and Child TPU are calculated separately. OEPL/PAEPL are applied per total guest count.
            </div>
          </div>
        </body>
        </html>
      `);

      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
    }

    function resetForm() {
      document.getElementById('username').value = '';
      document.getElementById('date').valueAsDate = new Date();
      document.getElementById('notes').value = '';
      document.getElementById('combo').value = '';
      document.getElementById('adults').value = '1';
      document.getElementById('children').value = '0';
      calculate();
    }

    document.getElementById('combo').addEventListener('change', calculate);
    document.getElementById('adults').addEventListener('input', calculate);
    document.getElementById('children').addEventListener('input', calculate);
    calculate();
  </script>
</body>
</html>
