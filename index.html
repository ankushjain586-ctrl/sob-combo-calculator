<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOB Combo Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:15px;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}.box{max-width:1000px;margin:auto;padding:20px;background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08)}h1{margin:0;font-size:2rem}.sub{margin:6px 0 16px;color:#666}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}.form>div{display:flex;flex-direction:column}.label,.section-title h2{font-weight:700}.login-box{margin:16px 0 18px;padding:14px;border:1px solid #ddd;border-radius:10px;background:#fafafa}.login-row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}.login-row>div{flex:1;min-width:220px}.login-actions{display:flex;gap:8px;flex-wrap:wrap}.user-status{margin-top:12px;font-size:.96rem}.user-status span{display:inline-block;padding:5px 10px;border-radius:999px;background:#e8f5e9;color:#1d6f3b;font-weight:700}.user-status span.guest{background:#f1f1f1;color:#555}.selected{display:flex;align-items:center;gap:8px;background:#f8f8f8;padding:12px 14px;border-radius:10px;margin:10px 0 18px;font-weight:700}.selected strong{color:#1d4d9b}.cards,.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}.card,.total{padding:18px;border-radius:10px;color:#fff}.card h3,.total h3{margin:0 0 10px;font-size:1rem}.card strong,.total strong{font-size:1.5rem}.card.adult{background:#1d4d9b}.card.child{background:#0a7d69}.total.tpu{background:#9c27b0}.total.oepl{background:#ff9800}.total.total{background:#3f51b5}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.button,button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.wa{background:#25d366;color:#fff}.save{background:#2196f3;color:#fff}.print{background:#ff9800;color:#fff}.danger{background:#d32f2f;color:#fff}.secondary{background:#e0e0e0;color:#222}.scroll{overflow:auto;border:1px solid #e0e0e0;border-radius:10px}.table,table{width:100%;border-collapse:collapse}.thead,th{background:#f3f5f7}.th,td{padding:10px 12px;border-bottom:1px solid #eee;text-align:left}.td.center{text-align:center}.saved .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.saved h2{margin:0}.muted{color:#666;font-style:italic}.input,select,input{padding:10px 12px;border-radius:8px;border:1px solid #cfcfcf;font-size:1rem;background:#fff}input:focus,select:focus{outline:2px solid rgba(33,150,243,.2);border-color:#2196f3}.small{padding:7px 10px;font-size:.8rem}.nowrap{white-space:nowrap}@media (max-width:640px){body{padding:10px}.box{padding:15px}.actions{flex-direction:column}.actions button{width:100%}.saved .section-title{display:block}.login-row{display:block}.login-actions{margin-top:10px}}</style>
</head>
<body>
<main class="box">
<h1>SOB Combo Calculator</h1>
<div class="sub">Statue of Belief Combo Calculator</div>

<div class="login-box">
  <div class="login-row">
    <div>
      <label for="username">User Name</label>
      <input id="username" type="text" placeholder="Enter your name">
    </div>
    <div class="login-actions">
      <button class="save" id="loginBtn">Login</button>
      <button class="secondary" id="switchUserBtn">Switch User</button>
    </div>
  </div>
  <div class="user-status"><strong>Logged in as:</strong> <span id="userBadge" class="guest">Guest</span></div>
</div>

<div class="form">
  <div>
    <label for="combo">Select Combo</label>
    <select id="combo"></select>
  </div>
  <div>
    <label for="adults">Adult Count</label>
    <input id="adults" type="number" min="0" value="2">
  </div>
  <div>
    <label for="children">Child Count</label>
    <input id="children" type="number" min="0" value="0">
  </div>
</div>

<div class="selected">Selected Combo<strong id="name">-</strong></div>
<div class="cards">
  <div class="card adult"><h3>Adult Price</h3><strong id="adultPrice">₹0</strong></div>
  <div class="card child"><h3>Child Price</h3><strong id="childPrice">₹0</strong></div>
  <div class="card total"><h3>Current Total</h3><strong id="currentTotal">₹0</strong></div>
</div>
<div class="totals">
  <div class="total tpu"><h3>Total TPU</h3><strong id="tpuTotal">₹0</strong></div>
  <div class="total oepl"><h3>Total OEPL</h3><strong id="oeplTotal">₹0</strong></div>
  <div class="total total"><h3>Grand Total</h3><strong id="grandTotal">₹0</strong></div>
</div>
<div class="actions">
  <button class="wa" id="share">Share on WhatsApp</button>
  <button class="save" id="save">Save SOB</button>
  <button class="print" onclick="window.print()">Print Saved SOBs</button>
</div>

<div class="saved">
  <div class="section-title">
    <h2>Saved SOB Combos</h2>
    <button class="danger" id="clear">Clear All Saved SOB</button>
  </div>
  <div class="scroll">
    <table>
      <thead>
        <tr>
          <th>SOB No.</th>
          <th>Combo</th>
          <th>Type</th>
          <th>Adults</th>
          <th>Children</th>
          <th>TPU</th>
          <th>OEPL</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="savedList"></tbody>
    </table>
  </div>
</div>
</main>
<script>
const data = [
  ['TU Explorer Combo','Combo 299/209',170,80,70,59,299,209],
  ['Adventure Combo','Combo 397/307',170,80,0,227,397,307],
  ['Eco Fun Combo','Combo 398/308',170,80,28,200,398,308],
  ['Snow Adventure Combo','Combo 408/318',170,80,0,238,408,318],
  ['Heritage Combo','Combo 499/399',170,80,16,310,499,399],
  ['Family Combo','Combo 619/509',170,80,0,470,619,509],
  ['Royal Combo','Combo 699/599',170,80,0,500,699,599],
  ['Premium Combo','Combo 799/699',170,80,0,600,799,699],
  ['Luxury Combo','Combo 899/799',170,80,0,700,899,799],
  ['Ultimate Combo','Combo 999/899',170,80,0,800,999,899]
];

const $ = id => document.getElementById(id);
const money = n => n == null ? 'NA' : '₹' + Number(n).toLocaleString('en-IN');
const count = e => Math.max(0, parseInt(e.value) || 0);
const currentUserKey = 'sobCurrentUser';

function getCurrentUser() {
  return (localStorage.getItem(currentUserKey) || '').trim();
}

function getStoredUserKey(username) {
  return 'sobSaved_' + (username || 'guest').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_');
}

function getSaved() {
  const user = getCurrentUser();
  if (!user) return [];
  try {
    return JSON.parse(localStorage.getItem(getStoredUserKey(user))) || [];
  } catch (e) {
    return [];
  }
}

function renderUserStatus() {
  const user = getCurrentUser();
  const badge = $('userBadge');
  badge.textContent = user || 'Guest';
  badge.classList.toggle('guest', !user);
}

function initializeComboList() {
  data.forEach((x, i) => {
    combo.add(new Option(`${x[0]} (${x[1]})`, i));
  });
  combo.value = '0';
  calculate();
}

function calculate() {
  const i = +combo.value;
  const x = data[i];
  const a = count(adults);
  const c = x[7] == null ? 0 : count(children);
  const adultAmount = a * x[6];
  const childAmount = c * (x[7] || 0);
  const total = adultAmount + childAmount;
  const tpu = a * x[2] + c * x[3];
  const oepl = a * x[4] + c * x[5];
  const grandTotal = tpu + oepl;

  $('name').textContent = x[0];
  $('adultPrice').textContent = money(x[6]);
  $('childPrice').textContent = money(x[7]);
  $('currentTotal').textContent = money(total);
  $('tpuTotal').textContent = money(tpu);
  $('oeplTotal').textContent = money(oepl);
  $('grandTotal').textContent = money(grandTotal);
}

function nextNumber() {
  const saved = getSaved();
  return saved.reduce((max, v) => Math.max(max, Number(v.number) || 0), 0) + 1;
}

function renderSaved() {
  renderUserStatus();
  const savedList = $('savedList');
  savedList.innerHTML = '';
  const user = getCurrentUser();

  if (!user) {
    savedList.innerHTML = '<tr><td colspan="9" class="muted">Please login with your name to save SOB combos.</td></tr>';
    return;
  }

  const saved = getSaved();
  if (!saved.length) {
    savedList.innerHTML = '<tr><td colspan="9" class="muted">No saved SOB combos for ' + user + '.</td></tr>';
    return;
  }

  saved.forEach(v => {
    savedList.insertAdjacentHTML('beforeend', `
      <tr>
        <td>${v.sobNo}</td>
        <td>${v.name}</td>
        <td>${v.type}</td>
        <td>${v.a}</td>
        <td>${v.c}</td>
        <td>${money(v.tpu)}</td>
        <td>${money(v.oepl)}</td>
        <td>${money(v.total)}</td>
        <td><button class="danger small" data-delete="${v.id}">Delete</button></td>
      </tr>
    `);
  });
}

function loginUser() {
  const name = $('username').value.trim();
  if (!name) {
    alert('Please enter your name to continue.');
    $('username').focus();
    return;
  }
  localStorage.setItem(currentUserKey, name);
  renderSaved();
}

function switchUser() {
  localStorage.removeItem(currentUserKey);
  $('username').value = '';
  renderSaved();
}

$('loginBtn').onclick = loginUser;
$('switchUserBtn').onclick = switchUser;
$('username').addEventListener('keydown', e => {
  if (e.key === 'Enter') loginUser();
});

combo.onchange = calculate;
adults.oninput = calculate;
children.oninput = calculate;

$('save').onclick = () => {
  const user = getCurrentUser();
  if (!user) {
    alert('Please login with your name first.');
    $('username').focus();
    return;
  }

  const i = +combo.value;
  const x = data[i];
  const a = count(adults);
  const c = x[7] == null ? 0 : count(children);
  const tpu = a * x[2] + c * x[3];
  const oepl = a * x[4] + c * x[5];
  const total = a * x[6] + c * (x[7] || 0);
  const number = nextNumber();
  const v = {
    id: Date.now(),
    number,
    sobNo: `SOB-${String(number).padStart(3, '0')}`,
    name: x[0],
    type: x[1],
    a,
    c,
    tpu,
    oepl,
    total
  };

  const saved = getSaved();
  saved.push(v);
  localStorage.setItem(getStoredUserKey(user), JSON.stringify(saved));
  renderSaved();
};

$('clear').onclick = () => {
  const user = getCurrentUser();
  if (!user) {
    alert('Please login with your name first.');
    $('username').focus();
    return;
  }

  if (confirm('Clear all saved SOB combos for ' + user + '?')) {
    localStorage.removeItem(getStoredUserKey(user));
    renderSaved();
  }
};

$('savedList').addEventListener('click', e => {
  const btn = e.target.closest('[data-delete]');
  if (!btn) return;

  const user = getCurrentUser();
  if (!user) return;

  const id = Number(btn.dataset.delete);
  const saved = getSaved().filter(v => v.id !== id);
  localStorage.setItem(getStoredUserKey(user), JSON.stringify(saved));
  renderSaved();
});

$('share').onclick = () => {
  const x = data[+combo.value];
  const user = getCurrentUser();
  const text = `SOB ${x[0]}\nUser: ${user || 'Guest'}\nAdult Price: ${money(x[6])}\nChild Price: ${money(x[7])}\nTPU Total: ${$('tpuTotal').textContent}\nOEPL Total: ${$('oeplTotal').textContent}\nGrand Total: ${$('grandTotal').textContent}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
};

$('exportExcel').onclick = () => {
  const user = getCurrentUser();
  if (!user) {
    alert('Please login with your name first.');
    $('username').focus();
    return;
  }

  const rows = getSaved();
  if (!rows.length) {
    alert('Save at least one SOB first.');
    return;
  }

  const header = ['SOB No.', 'Combo', 'Adult Quantity', 'Child Quantity', 'TPU Total', 'OEPL Total', 'Grand Total'];
  const csv = [header.join(',')].concat(rows.map(r => [r.sobNo, r.name, r.a, r.c, r.tpu, r.oepl, r.total].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(','))).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'sob-' + user.toLowerCase().replace(/\s+/g, '-') + '.csv';
  link.click();
  URL.revokeObjectURL(link.href);
};

const savedUser = getCurrentUser();
if (savedUser) {
  $('username').value = savedUser;
}

initializeComboList();
renderSaved();
</script>
</body>
</html>
