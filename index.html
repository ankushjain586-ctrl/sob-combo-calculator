<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Operations Summary - SOB</title>
<style>
body{font-family:Arial;padding:12px;background:#f5f7fb;margin:0}
h3{text-align:center;color:#1a2a4a}
.card{background:white;padding:12px;border-radius:10px;margin:10px 0;box-shadow:0 2px 5px #ccc}
input{width:85px;padding:7px;text-align:center;border:2px solid #1a2a4a;border-radius:6px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #eee}
label{font-size:13px}
textarea{width:100%;height:360px;font-size:14px;padding:10px;border-radius:8px;border:1px solid #999;box-sizing:border-box}
button{width:100%;padding:13px;background:#1a2a4a;color:white;border:none;border-radius:8px;font-size:16px;margin-top:8px;cursor:pointer}
.btn-green{background:#0f7a3d}
</style>
</head>
<body>
<h3>Today's Operations Summary</h3>

<div class="card">
<b>1. Ticket Plaza (TOTAL Only)</b>
<div class="row"><label>PARK ENTRY</label><input id="pe" type="number" placeholder="3300"></div>
<div class="row"><label>Viewing Gallery (VG)</label><input id="vg" type="number" placeholder="931"></div>
<div class="row"><label>VG 2nd</label><input id="vg2" type="number" placeholder="250"></div>
<div class="row"><label>VG + NAM</label><input id="vgn" type="number" placeholder="189"></div>
<div class="row"><label>Nij Manthan</label><input id="nij" type="number" placeholder="18"></div>
<div class="row"><label>VG+NAM+NAA</label><input id="vgnnaa" type="number" placeholder="18"></div>
<div class="row"><label>VG+NAA</label><input id="vgnaa" type="number" placeholder="7"></div>
<div class="row"><label>VG Express</label><input id="exp" type="number" placeholder="13"></div>
</div>

<div class="card" style="background:#ffe0b2">
<b>2. Upgrade Counter (TOTAL Only)</b>
<div class="row"><label>PARK -> VG</label><input id="u1" type="number" placeholder="268"></div>
<div class="row"><label>VG -> NAM</label><input id="u2" type="number" placeholder="36"></div>
<div class="row"><label>PARK -> Nij</label><input id="u3" type="number" placeholder="4"></div>
<div class="row"><label>NAM -> NAA</label><input id="u4" type="number" placeholder="3"></div>
<div class="row"><label>PARK -> NAM</label><input id="u5" type="number" placeholder="1"></div>
</div>

<button onclick="makeReport()">Generate Final Report</button>

<div class="card">
<textarea id="finalText">Today's Operations Summary.  DATE :- 

Viewing Gallery = 

Viewing Gallery + Nij Aatma Manthan = 

Nij Aatma Abhishek = 

Viewing Gallery + Nij Aatma Abhishek + Nij Aatma Manthan = 

Nij Aatma Manthan = 

Park Entry = 

Viewing Gallery Express:-

Total Footfall = </textarea>
<button class="btn-green" onclick="copyText()">Copy & WhatsApp Share</button>
</div>

<script>
function v(id){return parseInt(document.getElementById(id).value)||0}
function makeReport(){
 let pe=v('pe'), vg=v('vg'), vg2=v('vg2'), vgn=v('vgn'), nij=v('nij'), vgnnaa=v('vgnnaa'), vgnaa=v('vgnaa'), exp=v('exp');
 let u1=v('u1'), u2=v('u2'), u3=v('u3'), u4=v('u4'), u5=v('u5');

 // Final Logic
 let f_pe = pe - u1 - u3 - u5;
 let f_vg = vg + u1 - u2;
 let f_vg2 = vg2;
 let f_vgn = vgn + u2 + u5 - u4;
 let f_nij = nij + u3;
 let f_vgnnaa = vgnnaa + u4;
 let f_vgnaa = vgnaa;
 let f_exp = exp;
 let tot = f_pe+f_vg+f_vg2+f_vgn+f_nij+f_vgnnaa+f_vgnaa+f_exp;

 let today = new Date().toLocaleDateString('en-GB').replace(/\//g,'-');
 let text = `Today's Operations Summary.  DATE :- ${today} \n\nViewing Gallery = ${f_vg}\n\nViewing Gallery + Nij Aatma Manthan = ${f_vgn}\n\nNij Aatma Abhishek = ${f_vgnaa}\n\nViewing Gallery + Nij Aatma Abhishek + Nij Aatma Manthan = ${f_vgnnaa}\n\nNij Aatma Manthan = ${f_nij}\n\nPark Entry = ${f_pe}\n\nViewing Gallery Express:- ${f_exp}\n\nViewing Gallery (2nd) = ${f_vg2}\n\nTotal Footfall = ${tot}`;

 document.getElementById('finalText').value = text;
}
function copyText(){
 let t = document.getElementById('finalText').value;
 navigator.clipboard.writeText(t);
 window.open("https://wa.me/?text="+encodeURIComponent(t), '_blank');
}
</script>
</body>
</html>
