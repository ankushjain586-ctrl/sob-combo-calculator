<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOB - Vishwas Swaroopam</title>
<style>
body{margin:0;background:#ede8ff;font-family:system-ui;padding:12px}
.header{background:#000;border-radius:20px;padding:14px;text-align:center;margin-bottom:12px}
.header h2{color:#ff3b3b;margin:8px 0 2px;font-size:18px}
.header p{color:#fff;margin:0;font-size:11px;letter-spacing:2px}
.btn{border:none;border-radius:20px;padding:10px 16px;font-weight:700;color:#fff;cursor:pointer}
.card{background:#fff;border-radius:20px;padding:16px;margin:10px 0}
.sel{width:100%;padding:14px;border-radius:12px;border:1.5px solid #aaa;font-weight:700}
.row2{display:flex;gap:10px;margin:12px 0}
.box{flex:1;background:#f5f1ff;border-radius:14px;padding:10px;text-align:center;border:2px solid #b8b0db}
.box input{width:100%;padding:12px;border-radius:10px;border:2px solid #777;font-size:22px;font-weight:900;text-align:center;box-sizing:border-box;margin-top:5px}
.box input:disabled{background:#ddd}
.yellow{background:#ffe14d;border-radius:16px;padding:14px;margin:12px 0}
.r{display:flex;justify-content:space-between;padding:6px 0;font-weight:800}
.inp{width:100%;padding:14px;border-radius:12px;border:1.5px solid #aaa;font-weight:700;box-sizing:border-box;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ccc;padding:6px;text-align:center}th{background:#e8e4ff}
.del{border:none;background:#ff1a1a;color:#fff;padding:5px 10px;border-radius:8px;font-weight:800;cursor:pointer}
.user-chip{display:inline-block;background:#5a2ec0;color:#fff;padding:6px 12px;border-radius:20px;margin:4px;font-size:12px;font-weight:700;cursor:pointer}
.user-chip.active{background:#000;color:#ffe14d}
.print-head{display:none}
@media print{.no-print{display:none !important}body{background:#fff}.print-head{display:flex !important;align-items:center;gap:12px;border-bottom:3px solid #000;padding-bottom:12px;margin-bottom:12px}.print-head img{height:70px}}
</style></head>
<body>

<div class="header no-print">
<img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD..." style="height:75px">
<h2>॥ विश्वास स्वरूपम ॥</h2><p>STATUE OF BELIEF</p>
<div style="color:#ffe14d;font-weight:800;margin-top:6px">SOB DAILY CALCULATOR</div>
</div>
