      padding: 16px;
    }

    .container {

      margin: 0 auto;
    }

    .top-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .top-btn {
      padding: 14px 16px;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-reverse {
      background: linear-gradient(135deg, #00d97e 0%, #00b85c 100%);
      box-shadow: 0 4px 15px rgba(0, 217, 126, 0.3);
    }

    .btn-reverse:active {
      transform: scale(0.98);
    }

    .btn-daily {
      background: linear-gradient(135deg, #9c27b0 0%, #7b1fa2 100%);
      box-shadow: 0 4px 15px rgba(156, 39, 176, 0.3);
    }

    .btn-daily:active {
      transform: scale(0.98);
    }

    .user-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding: 14px 16px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .user-icon {
      font-size: 28px;
    }

    .user-input {
      flex: 1;
      border: none;
      background: none;
      font-size: 16px;
      color: #333;
      outline: none;
      font-weight: 500;
    }

    .user-input::placeholder {
      color: #999;
    }

    .load-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
      color: white;
      border: none;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(30, 136, 229, 0.3);
    }

    .load-btn:active {
      transform: scale(0.98);
    }

    .title {

      font-size: 32px;

      color: #1a1a1a;

      background: #f5f5f5;
      border-radius: 14px;
      font-size: 16px;
      color: #333;
      outline: none;
      transition: all 0.3s ease;

    }

      border-radius: 12px;
      font-size: 20px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);

      border: 2px solid rgba(30, 136, 229, 0.2);
      border-radius: 14px;
      padding: 16px;
      margin-top: 16px;
      margin-bottom: 16px;
    }

    .breakdown-title {
      font-size: 13px;
      font-weight: 700;
      color: #1e88e5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .breakdown-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 14px;
      color: #666;
    }

    .breakdown-value {
      font-weight: 700;
      color: #1a1a1a;
      font-family: 'Courier New', monospace;
    }

    .sob-id-section {
      position: relative;
      margin-bottom: 16px;
    }

    .sob-id-input {
      padding-right: 50px;
    }

    .camera-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: #333;
      color: white;
      border: none;
      border-radius: 10px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.3s ease;
    }

    .camera-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .btn-primary {
      padding: 14px 20px;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-save {
      background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
      box-shadow: 0 4px 15px rgba(30, 136, 229, 0.3);
    }

    .btn-reset {
      background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
      box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
    }

    .print-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;

    .btn-secondary {

      border-radius: 16px;

      align-items: center;

      gap: 8px;

    .btn-secondary:active {

      background: #f5f5f5;

    .footer-info {
      text-align: center;
      font-size: 11px;
      color: #999;
      margin-top: 16px;
      line-height: 1.6;

    @media (max-width: 480px) {
      .title {

      }

      }

      .print-section {
        grid-template-columns: 1fr;
      }

</head>

    function formatMoney(value) {
      return '₹ ' + Number(value).toLocaleString('en-IN');
    }

    function calculate() {
      const comboId = document.getElementById('combo').value;
      const adults = Number(document.getElementById('adults').value || 0);
      const children = Number(document.getElementById('children').value || 0);

      if (!comboId || !COMBOS[comboId]) {
        document.getElementById('tpuDisplay').textContent = '₹ 0';
        document.getElementById('oeplDisplay').textContent = '₹ 0';
        document.getElementById('paeplDisplay').textContent = '₹ 0';
        document.getElementById('totalDisplay').textContent = '₹ 0';
        document.getElementById('breakdownSection').style.display = 'none';
        return;
      }

      const combo = COMBOS[comboId];
      const totalGuests = adults + children;
      const tpu = (combo.tpuAdult * adults) + (combo.tpuChild * children);
      const oepl = combo.offspring * totalGuests;
      const paepl = combo.pinnacle * totalGuests;
      const total = tpu + oepl + paepl;

      document.getElementById('tpuDisplay').textContent = formatMoney(tpu);
      document.getElementById('oeplDisplay').textContent = formatMoney(oepl);
      document.getElementById('paeplDisplay').textContent = formatMoney(paepl);
      document.getElementById('totalDisplay').textContent = formatMoney(total);

      // Update breakdown
      document.getElementById('breakdownTpuAdult').textContent = formatMoney(combo.tpuAdult);
      document.getElementById('breakdownTpuChild').textContent = formatMoney(combo.tpuChild);
      document.getElementById('breakdownOffspring').textContent = formatMoney(combo.offspring);
      document.getElementById('breakdownPinnacle').textContent = formatMoney(combo.pinnacle);
      document.getElementById('breakdownSection').style.display = 'block';
    }

    function resetForm() {
      document.getElementById('combo').value = '';
      document.getElementById('adults').value = '1';
      document.getElementById('children').value = '1';
      document.getElementById('sobId').value = '';
      document.getElementById('breakdownSection').style.display = 'none';
      calculate();
    }

      const comboId = document.getElementById('combo').value;
      const sobId = document.getElementById('sobId').value;
      const username = document.getElementById('username').value;
      const adults = document.getElementById('adults').value;
      const children = document.getElementById('children').value;

      if (!sobId || sobId.length !== 6) {
        alert('Please enter a valid 6-digit SOB ID');
        return;
      }

      if (!comboId) {
        alert('Please select a combo');
        return;
      }

      const data = {
        username,
        sobId,
        comboId,
        adults,
        children,
        timestamp: new Date().toLocaleString('en-IN')
      };

      localStorage.setItem(`SOB_${sobId}`, JSON.stringify(data));
      alert(`SOB Data saved successfully!\nID: ${sobId}`);
    }

      const username = document.getElementById('username').value;
      if (!username) {

              margin-bottom: 20px;
              background: white;
              border: 2px solid #ffd700;
            }
            .results-table td {
              padding: 14px;
              border-bottom: 1px solid #eee;
            }
            .results-table td:first-child {
              font-weight: 700;
              width: 50%;
            }
            .results-table td:last-child {
              text-align: right;
              font-weight: 700;
              font-family: 'Courier New', monospace;
              color: #1a1a1a;
            }
            .results-table .total-row {
              background: #fff8dc;
              font-size: 16px;
            }
            .footer {
              margin-top: 30px;
              text-align: center;
              color: #999;
              font-size: 12px;
            }
          </style>
        </head>
        <body>
          <div class="container">
            <div class="header">
              <h1>⚡ SOB CoMbos Calculator ⚡</h1>
              <div style="color: #666;">Calculation Sheet</div>
            </div>

            <div class="info-grid">
              <div class="info-item">
                <div class="info-label">User Name</div>
                <div class="info-value">${username}</div>
              </div>
              <div class="info-item">
                <div class="info-label">SOB ID</div>
                <div class="info-value">${sobId}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Combo Selected</div>
                <div class="info-value">${comboName}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Date</div>
                <div class="info-value">${new Date().toLocaleDateString('en-IN')}</div>
              </div>
            </div>

            <div class="breakdown-section">
              <div class="breakdown-title">👥 Guest Information</div>
              <div class="breakdown-row">
                <span>Adults</span>
                <span>${adults}</span>
              </div>
              <div class="breakdown-row">
                <span>Children</span>
                <span>${children}</span>
              </div>
              <div class="breakdown-row">
                <span><strong>Total Guests</strong></span>
                <span><strong>${totalGuests}</strong></span>
              </div>
            </div>

            <div class="breakdown-section">
              <div class="breakdown-title">💰 Price Segregation</div>
              <div class="breakdown-row">
                <span>TPU (Adult) per person</span>
                <span>₹${combo.tpuAdult.toLocaleString('en-IN')}</span>
              </div>
              <div class="breakdown-row">
                <span>TPU (Child) per person</span>
                <span>₹${combo.tpuChild.toLocaleString('en-IN')}</span>
              </div>
              <div class="breakdown-row">
                <span>Offspring (Amount) per guest</span>
                <span>₹${combo.offspring.toLocaleString('en-IN')}</span>
              </div>
              <div class="breakdown-row">
                <span>Pinnacle (Amount) per guest</span>
                <span>₹${combo.pinnacle.toLocaleString('en-IN')}</span>
              </div>
            </div>

            <table class="results-table">
              <tr><td>TPU</td><td>₹${tpu.toLocaleString('en-IN')}</td></tr>
              <tr><td>OEPL (Offspring)</td><td>₹${oepl.toLocaleString('en-IN')}</td></tr>
              <tr><td>PAEPL (Pinnacle)</td><td>₹${paepl.toLocaleString('en-IN')}</td></tr>
              <tr class="total-row"><td>TOTAL</td><td>₹${total.toLocaleString('en-IN')}</td></tr>
            </table>

            <div class="footer">
              <strong>Printed on:</strong> ${new Date().toLocaleString('en-IN')}<br>
              <strong>Formula:</strong> TPU = (Adult Price × Adults) + (Child Price × Children) | 
              OEPL/PAEPL = Per-Guest Rate × Total Guests
            </div>
          </div>
        </body>
        </html>
      `);

      printWindow.document.close();
      printWindow.focus();
      setTimeout(() => printWindow.print(), 250);
    }

    function togglePrintMenu() {
      alert('Print Menu: Select print option\n• Print MY A4\n• Print ALL');
    }

    calculate();
  </script>
</body>
</html>
