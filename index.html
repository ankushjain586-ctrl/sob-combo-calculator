<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOB Combo Calculator</title>
  <style>
    :root {
      --bg: #edf3fb;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #5d6b82;
      --line: #dfe6f0;
      --primary: #224a7c;
      --primary-2: #1d3d6a;
      --accent: #f4b942;
      --success: #1da66d;
      --shadow: 0 12px 28px rgba(25, 40, 60, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #f3f7fb 0%, #eef4fb 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }
    .page {
      max-width: 980px;
      margin: 28px auto;
      padding: 24px 18px 40px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 24px;
    }
    h1 {
      margin: 0 0 18px;
      font-size: clamp(1.7rem, 3vw, 2.5rem);
      text-align: center;
      color: var(--primary);
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--muted);
    }
    select, input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    select:focus, input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(34, 74, 124, 0.12);
    }
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .summary {
      margin-top: 8px;
      background: #f7faff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 20px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
    }
    .row:last-child {
      border-bottom: none;
    }
    .total {
      margin-top: 10px;
      padding-top: 10px;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .highlight {
      display: inline-block;
      background: #fff7d8;
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 6px 12px;
      color: #3a3106;
      font-size: 1.1rem;
    }
    .note {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }
    @media (max-width: 640px) {
      .two-col { grid-template-columns: 1fr; }
      .page { padding: 14px; }
      .card { padding: 18px 14px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>SOB Combo Calculator</h1>

      <div class="field">
        <label for="combo">Select Combo</label>
        <select id="combo">
          <option value="">Choose a combo</option>
          <option value="1">Explorer Combo — PE + Wax Museum + Eylusion + World of Ganesha</option>
          <option value="2">Eco Adventure Combo — PE + Any 4 Rides or Games + 1 Time Drop Only</option>
          <option value="3">Eco Fun Combo — PE + 12 Cinema + Mirror Maze + Horror House + Wax Museum</option>
          <option value="4">Snow Adventure Combo — PE + Snow Park</option>
          <option value="5">Aastha Combo — PE + NAM + 1 Time Drop Off Only + Eylusion + World of Ganesha + Krishna + World of Ganesha</option>
          <option value="6">Adventure Combo — PE + 10 Rides + Go Kart + 3 times Pick-up or Drop-off</option>
          <option value="7">Namah Combo — PE + VG + NAM + 1 Time Drop only + World of Ganesha + World of Krishna</option>
          <option value="8">Viewing Fun Combo — PE + VG + Wax Museum + Eylusion + Food Voucher worth of Rs. 50 + 1 Time pick-up and 1 time drop-off + Souvenir worth Rs. 75/+ + World of Ganesha + World of Krishna</option>
          <option value="9">Symbolic Play Combo — PE + VG + Snow Park + Food Voucher worth of Rs. 55 + 1 Time drop only + World of Ganesha + World of Krishna</option>
          <option value="10">Ultimate Play Combo — PE + Snow Park + Any 4 Rides + 1 Time Drop Off Only + 12 Cinema + Mirror Maze + Horror House + World of Ganesha</option>
          <option value="11">Delight Combo — PE + NAM + Eylusion + 1 Time pick-up and 1 time drop-off + World of Ganesha + World of Krishna + Souvenir worth Rs. 75/+ + Food Voucher worth of Rs. 50 + 12 Cinema + HH + MM</option>
          <option value="12">Mini Blast Combo — PE + VG + NAM + World of Ganesha + Wax Museum + World of Krishna + Food Voucher worth 55/- and souvenir worth Rs. 110/+ + 1 time pick-up &amp; 1 time drop</option>
          <option value="13">All in fun Combo — PE + Viewing Gallery + Snow Park + Any 4 Rides + 1 Time Drop Only + World of Ganesha + World of Krishna + 12 Cinema + Mirror Maze + Horror House</option>
          <option value="14">Divine Rush Combo — PE + VG + NAM + NAA + 3 times Pick-up or Drop-off + World of Ganesha + World of Krishna + Complimentary Wax Museum</option>
          <option value="15">Ultimate Mega Combo — PE + VG + NAM + NAA + Snow Park + Wax Museum + Eylusion + Any 10 Rides + Go Kart + Crickets + VR Zone + Souvenir Worth Rs. 110 + Bungee Jumping + Food Voucher worth of Rs. 110 + 3 Times Pick-up or Drop-off + World of Ganesha + World of Krishna + 12 Cinema + Mirror Maze + Horror House</option>
        </select>
      </div>

      <div class="two-col">
        <div class="field">
          <label for="adults">Adults</label>
          <input id="adults" type="number" min="0" value="1" />
        </div>
        <div class="field">
          <label for="children">Children</label>
          <input id="children" type="number" min="0" value="0" />
        </div>
      </div>

      <div class="summary">
        <div class="row"><span>TPU</span><span id="tpuDisplay">₹0</span></div>
        <div class="row"><span>OEPL</span><span id="oeplDisplay">₹0</span></div>
        <div class="row"><span>PAEPL</span><span id="paeplDisplay">₹0</span></div>
        <div class="row total"><span>Total</span><span class="highlight" id="totalDisplay">₹0</span></div>
      </div>

      <div class="note">Formula used: Adult TPU and Child TPU are calculated separately, and OEPL/PAEPL are applied per total guest count.</div>
    </div>
  </div>

  <script>
    const COMBOS = {
      1: { adult: 170, child: 80, oepl: 40, paepl: 89 },
      2: { adult: 170, child: 80, oepl: 0, paepl: 227 },
      3: { adult: 170, child: 80, oepl: 28, paepl: 200 },
      4: { adult: 170, child: 80, oepl: 255, paepl: 0 },
      5: { adult: 470, child: 400, oepl: 0, paepl: 100 },
      6: { adult: 170, child: 0, oepl: 0, paepl: 529 },
      7: { adult: 650, child: 475, oepl: 0, paepl: 50 },
      8: { adult: 470, child: 280, oepl: 155, paepl: 150 },
      9: { adult: 470, child: 280, oepl: 249, paepl: 50 },
      10: { adult: 170, child: 80, oepl: 199, paepl: 520 },
      11: { adult: 470, child: 380, oepl: 105, paepl: 350 },
      12: { adult: 670, child: 480, oepl: 199, paepl: 100 },
      13: { adult: 450, child: 275, oepl: 200, paepl: 450 },
      14: { adult: 1450, child: 875, oepl: 0, paepl: 100 },
      15: { adult: 1500, child: 300, oepl: 449, paepl: 2300 }
    };

    function formatMoney(value) {
      return '₹' + Number(value).toLocaleString('en-IN');
    }

    function calculate() {
      const comboId = document.getElementById('combo').value;
      const adults = Number(document.getElementById('adults').value || 0);
      const children = Number(document.getElementById('children').value || 0);

      if (!comboId || !COMBOS[comboId]) {
        document.getElementById('tpuDisplay').textContent = '₹0';
        document.getElementById('oeplDisplay').textContent = '₹0';
        document.getElementById('paeplDisplay').textContent = '₹0';
        document.getElementById('totalDisplay').textContent = '₹0';
        return;
      }

      const combo = COMBOS[comboId];
      const totalGuests = adults + children;
      const tpu = (combo.adult * adults) + (combo.child * children);
      const oepl = combo.oepl * totalGuests;
      const paepl = combo.paepl * totalGuests;
      const total = tpu + oepl + paepl;

      document.getElementById('tpuDisplay').textContent = formatMoney(tpu);
      document.getElementById('oeplDisplay').textContent = formatMoney(oepl);
      document.getElementById('paeplDisplay').textContent = formatMoney(paepl);
      document.getElementById('totalDisplay').textContent = formatMoney(total);
    }

    document.getElementById('combo').addEventListener('change', calculate);
    document.getElementById('adults').addEventListener('input', calculate);
    document.getElementById('children').addEventListener('input', calculate);
    calculate();
  </script>
</body>
</html>
