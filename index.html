<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SOB Calculator + Activities</title>
<style>
body{font-family:Arial;background:#fef6f0;margin:0;padding:10px}
.header{background:#7a1e1e;color:#fff;text-align:center;padding:12px;border-radius:10px}
.btn{background:#7a1e1e;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;margin:2px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.1)}
th{background:#7a1e1e;color:#fff;padding:6px;font-size:11px}
td{border:1px solid #eee;padding:5px;font-size:11px;text-align:center}
.act{text-align:left!important;font-size:10px;background:#fffaf5}
.total-row{background:#ffe8d6;font-weight:bold}
input,select{width:95%;padding:3px;font-size:11px}
</style></head><body>
<div class="header"><h2 style="margin:0">SOB Calculator + Activities Amount (12 Oct Final)</h2><p style="margin:4px 0 0;font-size:11px">TPU + Offspring(OEPL) + Pinnacle(PAEPL) + Total + Activities Breakup</p></div>
<div style="background:#fff;padding:8px;margin:10px 0;border-radius:8px"><button class="btn" onclick="addRow()">+ Add Row</button><button class="btn" onclick="calc()">Calculate</button><button class="btn" onclick="clearAll()">Clear</button></div>
<table><thead><tr><th>#</th><th style="width:20%">Combo</th><th>Adult</th><th>Child</th><th>TPU</th><th>OEPL Off</th><th>PAEPL Pin</th><th>Total</th><th style="width:30%">ACTIVITIES AMOUNTS</th></tr></thead>
<tbody id="tbody"></tbody><tfoot><tr class="total-row"><td colspan="2">TOTAL</td><td id="tA">0</td><td id="tC">0</td><td id="tTPU">0</td><td id="tOff">0</td><td id="tPin">0</td><td id="tTot">0</td><td id="tAct" style="text-align:left;font-size:10px"></td></tr></tfoot></table>
<script>
const combos=[
{Name:"Explorer Combo",Park:170,VG:0,Snow:0,Food:0,Souvenir:0,Wax:40,Eyelusion:40,any4:0,any10:0,GoKart:0,Bungee:0,Pick1:0,Pick2:0,Pick3:0,WG:49,D12:0,TPU:170,Off:40,Pin:89,Total:299,Child:209},
{Name:"Eco Adventure Combo",Park:170,VG:0,Snow:0,Food:0,Souvenir:0,Wax:0,Eyelusion:0,any4:177,any10:0,GoKart:0,Bungee:0,Pick1:50,Pick2:0,Pick3:0,WG:0,D12:0,TPU:170,Off:0,Pin:227,Total:397,Child:307},
{Name:"Eco Fun Combo",Park:170,VG:0,Snow:0,Food:0,Souvenir:0,Wax:28,Eyelusion:0,any4:0,any10:0,GoKart:0,Bungee:0,Pick1:0,Pick2:0,Pick3:0,WG:0,D12:200,TPU:170,Off:28,Pin:200,Total:398,Child:308},
{Name:"Snow Adventure Combo",Park:170,VG:0,Snow:255,Food:0,Souvenir:0,Wax:0,Eyelusion:0,any4:0,any10:0,GoKart:0,Bungee:0,Pick1:0,Pick2:0,Pick3:0,WG:0,D12:0,TPU:170,Off:255,Pin:0,Total:425,Child:335},
{Name:"Aastha  Combo",Park:170,VG:0,Snow:0,Food:0,Souvenir:0,Wax:0,Eyelusion:50,any4:0,any10:0,GoKart:0,Bungee:0,Pick1:0,Pick2:50,Pick3:0,WG:0,D12:0,TPU:470,Off:0,Pin:100,Total:570,Child:500},
{Name:"Adventure Combo",Park:170,VG:0,Snow:0,Food:0,Souvenir:0,Wax:0,Eyelusion:0,any4:0,any10:279,GoKart:150,Bungee:0,Pick1:0,Pick2:0,Pick3:100,WG:0,D12:0,TPU:170,Off:0,Pin:529,Total:699,Child:0},
{Name:"Namah Combo",Park:150,VG:200,Snow:0,Food:0,Souvenir:0,Wax:0,Eyelusion:0,any4:0,any10:0,GoKart:0,Bungee:0,Pick1:50,Pick2:0,Pick3:0,WG:0,D12:0,TPU:650,Off:0,Pin:50,Total:700,Child:525},
{Name:"Viewing Fun Combo",Park:170,VG:200,Snow:0,Food:45,Souvenir:60,Wax:50,Eyelusion:50,any4:0,any10:0,GoKart:0,Bungee:0,Pick1:0,Pick2:100,Pick3:0,WG:0,D12:0,TPU:470,Off:155,Pin:150,Total:775,Child:585},
{Name:"Symbolic Play Combo",Park:170,VG:200,Snow:200,Food:49,Souvenir:0,Wax:0,Eyelusion:0,any4:0,any10:0,GoKart:0,Bungee:0,Pick1:50,Pick2:0,Pick3:0,WG:0,D12:0,TPU:470,Off:249,Pin:50,Total:769,Child:579},
{Name:"Ultimate Play Combo",Park:170,VG:0,Snow:199,Food:0,Souvenir:0,Wax:0,Eyelusion:0,any4:200,any10:0,GoKart:0,Bungee:0,Pick1:50,Pick2:0,Pick3:0,WG:70,D12:200,TPU:170,Off:199,Pin:520,Total:889,Child:799},
{Name:"Delight Combo",Park:170,VG:0,Snow:0,Food:45,Souvenir:60,Wax:0,Eyelusion:50,any4:0,any10:0,GoKart:0,Bungee:0,Pick1:0,Pick2:100,Pick3:0,WG:0,D12:200,TPU:470,Off:105,Pin:350,Total:925,Child:835},
{Name:"Mini Blast Combo",Park:170,VG:200,Snow:0,Food:50,Souvenir:99,Wax:50,Eyelusion:0,any4:0,any10:0,GoKart:0,Bungee:0,Pick1:0,Pick2:100,Pick3:0,WG:0,D12:0,TPU:670,Off:199,Pin:100,Total:969,Child:779},
{Name:"All in fun Combo",Park:150,VG:200,Snow:200,Food:0,Souvenir:0,Wax:0,Eyelusion:0,any4:200,any10:0,GoKart:0,Bungee:0,Pick1:50,Pick2:0,Pick3:0,WG:0,D12:200,TPU:450,Off:200,Pin:450,Total:1100,Child:925},
{Name:"Divine Rush Combo",Park:150,VG:200,Snow:0,Food:0,Souvenir:0,Wax:0,Eyelusion:0,any4:0,any10:0,GoKart:0,Bungee:0,Pick1:0,Pick2:0,Pick3:100,WG:0,D12:0,TPU:1450,Off:0,Pin:100,Total:1550,Child:975},
{Name:"Ultimate Mega Combo",Park:150,VG:200,Snow:150,Food:99,Souvenir:100,Wax:50,Eyelusion:50,any4:0,any10:300,GoKart:150,Bungee:1500,Pick1:0,Pick2:0,Pick3:100,WG:0,D12:150,TPU:1500,Off:449,Pin:2300,Total:4249,Child:0},
];
let rc=0;
function addRow(){
 rc++;
 let tb=document.getElementById('tbody');
 let tr=document.createElement('tr');
 tr.innerHTML=`<td>${rc}</td><td><select class="combo" onchange="calc()"><option value="">Select</option>${combos.map((c,i)=>`<option value="${i}">${c.Name} - ${c.Total}/-</option>`).join('')}</select></td><td><input type="number" class="ad" value="1" min="0" oninput="calc()"></td><td><input type="number" class="ch" value="0" min="0" oninput="calc()"></td><td class="tpu">0</td><td class="oe">0</td><td class="pa">0</td><td class="tot">0</td><td class="act act">-</td>`;
 tb.appendChild(tr);
}
function calc(){
 let sA=0,sC=0,sTPU=0,sOff=0,sPin=0,sTot=0; let agg={};
 document.querySelectorAll('#tbody tr').forEach(row=>{
  let sel=row.querySelector('.combo'); let idx=sel.value;
  if(idx===""){ row.querySelector('.tpu').innerText=0; row.querySelector('.oe').innerText=0; row.querySelector('.pa').innerText=0; row.querySelector('.tot').innerText=0; row.querySelector('.act').innerText="-"; return; }
  let c=combos[idx];
  let ad=parseInt(row.querySelector('.ad').value)||0;
  let ch=parseInt(row.querySelector('.ch').value)||0;
  let tpu=c.TPU*ad;
  let off=c.Off*ad;
  let pin=c.Pin*ad;
  let tot=c.Total*ad + c.Child*ch;
  row.querySelector('.tpu').innerText=tpu;
  row.querySelector('.oe').innerText=off;
  row.querySelector('.pa').innerText=pin;
  row.querySelector('.tot').innerText=tot;
  sA+=ad; sC+=ch; sTPU+=tpu; sOff+=off; sPin+=pin; sTot+=tot;
  let parts=[];
  if(c.Snow){ parts.push(`OEPL -> Snow:${c.Snow*ad}`); agg['Snow']=(agg['Snow']||0)+c.Snow*ad; }
  if(c.Wax){ parts.push(`OEPL -> Wax:${c.Wax*ad}`); agg['Wax']=(agg['Wax']||0)+c.Wax*ad; }
  if(c.Food){ parts.push(`OEPL -> Food:${c.Food*ad}`); agg['Food']=(agg['Food']||0)+c.Food*ad; }
  if(c.Souvenir){ parts.push(`OEPL -> Souvenir:${c.Souvenir*ad}`); agg['Souvenir']=(agg['Souvenir']||0)+c.Souvenir*ad; }
  let pa=[];
  if(c.Eyelusion){ pa.push(`Eyelusion:${c.Eyelusion*ad}`); agg['Eyelusion']=(agg['Eyelusion']||0)+c.Eyelusion*ad; }
  if(c.any4){ pa.push(`any4:${c.any4*ad}`); agg['any4']=(agg['any4']||0)+c.any4*ad; }
  if(c.any10){ pa.push(`any10:${c.any10*ad}`); agg['any10']=(agg['any10']||0)+c.any10*ad; }
  if(c.GoKart){ pa.push(`GoKart:${c.GoKart*ad}`); agg['GoKart']=(agg['GoKart']||0)+c.GoKart*ad; }
  if(c.Bungee){ pa.push(`Bungee:${c.Bungee*ad}`); agg['Bungee']=(agg['Bungee']||0)+c.Bungee*ad; }
  if(c.D12){ pa.push(`12D:${c.D12*ad}`); agg['12D']=(agg['12D']||0)+c.D12*ad; }
  if(c.WG){ pa.push(`W.Ganesha:${c.WG*ad}`); agg['WG']=(agg['WG']||0)+c.WG*ad; }
  let pick=c.Pick1+c.Pick2+c.Pick3; if(pick){ pa.push(`Pick/Drop:${pick*ad}`); agg['Pick']=(agg['Pick']||0)+pick*ad; }
  let txt=parts.join(' | ');
  if(pa.length){ if(txt) txt+=' | '; txt+='PAEPL -> '+pa.join(' | '); }
  row.querySelector('.act').innerText=txt||'-';
 });
 document.getElementById('tA').innerText=sA;
 document.getElementById('tC').innerText=sC;
 document.getElementById('tTPU').innerText=sTPU;
 document.getElementById('tOff').innerText=sOff;
 document.getElementById('tPin').innerText=sPin;
 document.getElementById('tTot').innerText=sTot;
 let aStr=[]; for(let k in agg) aStr.push(k+':'+agg[k]); document.getElementById('tAct').innerText=aStr.join(' | ');
}
function clearAll(){ document.getElementById('tbody').innerHTML=''; rc=0; addRow(); addRow(); addRow(); calc(); }
addRow(); addRow(); addRow(); calc();
</script></body></html>
