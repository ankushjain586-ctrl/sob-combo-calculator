<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOB - Dynamic Footfall</title>
<style>
body{font-family:Arial;background:#f5f7fb;margin:0;padding:10px}
h1{text-align:center;color:#1a2a4a;font-size:16px}
.card{background:#fff;border-radius:10px;padding:10px;margin:10px 0;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
.yellow{background:#fff9c4} .orange{background:#ffe0b2} .green{background:#d1e7dd}
input,select{padding:5px;text-align:center;border:1px solid #999;border-radius:5px}
input{width:50px} select{width:110px;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#1a2a4a;color:white;padding:5px;font-size:11px}
td{padding:4px;border:1px solid #ddd;text-align:center}
.final{font-weight:bold;color:#0f5132}
button{padding:8px 12px;border:none;border-radius:6px;cursor:pointer}
.btn-main{background:#1a2a4a;color:white;width:100%;margin-top:6px}
.btn-add{background:#ff9800;color:white;width:100%;margin-top:8px}
.btn-del{background:#d32f2f;color:white;padding:2px 6px;font-size:10px}
</style>
</head>
<body>
<h1>SOB - Dynamic Footfall Calculator</h1>

<div class="card yellow">
<h3>STEP 1: Ticket Plaza (Fixed List)</h3>
<table id="plazaTable">
<tr><th>Ticket</th><th>A</th><th>C</th><th>Tot</th></tr>
</table>
</div>

<div class="card orange">
<h3>STEP 2: Upgrade Counter (Dynamic - Kitna bhi badh jaye)</h3>
<table id="upgradeTable">
<tr><th>From -> To</th><th>A</th><th>C</th><th>Tot</th><th>X</th></tr>
</table>
<button class="btn-add" onclick="addUpgradeRow()">+ Add New Upgrade Type</button>
<p style="font-size:10px;color:#555;margin:4px 0">Example: PARK ENTRY -> PE+VG, PE+VG -> PE+VG+NAM, etc. Jitne chaho add karo.</p>
</div>

<div class="card green">
<h3>STEP 3: FINAL REPORT - Auto</h3>
<table id="finalTable">
<tr><th>Ticket</th><th>Final</th></tr>
</table>
<button class="btn-main" onclick="calc()">Calculate</button>
<button class="btn-main" style="background:#0f5132" onclick="window.print()">Print Photo</button>
</div>

<script>
const plazaTickets = [
 "PARK ENTRY",
 "PE + VG(280 Ft)",
 "PE + VG(280 Ft) + NAM",
 "PE + VG(280Ft) 2nd",
 "PE +VG +NAM +NAA",
 "PE + NAM",
 "PE + VG(Express)"
];

let upgrades = [];

function initPlaza(){
 let html = "<tr><th>Ticket</th><th>A</th><th>C</th><th>Tot</th></tr>";
 plazaTickets.forEach((t,i)=>{
  html+=`<tr><td>${t}</td><td><input id="p_a_${i}" type="number" value="0"></td><td><input id="p_c_${i}" type="number" value="0"></td><td id="p_t_${i}">0</td></tr>`;
 });
 document.getElementById('plazaTable').innerHTML=html;
}

function addUpgradeRow(fromIdx=0,toIdx=1,a=0,c=0){
 let idx = upgrades.length;
 let fromOptions = plazaTickets.map((t,i)=>`<option value="${i}" ${i==fromIdx?'selected':''}>${t}</option>`).join('');
 let toOptions = plazaTickets.map((t,i)=>`<option value="${i}" ${i==toIdx?'selected':''}>${t}</option>`).join('');
 
 let tr = document.createElement('tr');
 tr.id = `up_row_${idx}`;
 tr.innerHTML = `
  <td><select id="up_from_${idx}">${fromOptions}</select> -> <select id="up_to_${idx}">${toOptions}</select></td>
  <td><input id="up_a_${idx}" type="number" value="${a}"></td>
  <td><input id="up_c_${idx}" type="number" value="${c}"></td>
  <td id="up_t_${idx}">0</td>
  <td><button class="btn-del" onclick="delRow(${idx})">X</button></td>
 `;
 document.getElementById('upgradeTable').appendChild(tr);
 upgrades.push(idx);
 attachListeners();
}

function delRow(idx){
 document.getElementById(`up_row_${idx}`)?.remove();
 upgrades = upgrades.filter(i=>i!=idx);
 calc();
}

function attachListeners(){
 document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',calc));
 document.querySelectorAll('select').forEach(el=>el.addEventListener('change',calc));
}

function toInt(id){return parseInt(document.getElementById(id)?.value)||0}

function calc(){
 let plazaTotals = plazaTickets.map((_,i)=>{
  let tot = toInt(`p_a_${i}`)+toInt(`p_c_${i}`);
  let el = document.getElementById(`p_t_${i}`);
  if(el) el.innerText=tot;
  return tot;
 });

 let finalCounts = [...plazaTotals]; // start with same

 upgrades.forEach(idx=>{
  let fromEl = document.getElementById(`up_from_${idx}`);
  let toEl = document.getElementById(`up_to_${idx}`);
  if(!fromEl||!toEl) return;
  let from = parseInt(fromEl.value);
  let to = parseInt(toEl.value);
  let upTot = toInt(`up_a_${idx}`)+toInt(`up_c_${idx}`);
  let el = document.getElementById(`up_t_${idx}`);
  if(el) el.innerText=upTot;

  finalCounts[from] -= upTot; // jisse upgrade hua waha se less
  finalCounts[to] += upTot;    // jisme hua waha add
 });

 let finalHtml = "<tr><th>Ticket</th><th>Final</th></tr>";
 let grand=0;
 plazaTickets.forEach((t,i)=>{
  finalHtml+=`<tr><td>${t}</td><td class="final">${finalCounts[i]}</td></tr>`;
  grand+=finalCounts[i];
 });
 finalHtml+=`<tr><th>GRAND TOTAL</th><th class="final">${grand}</th></tr>`;
 document.getElementById('finalTable').innerHTML=finalHtml;
}

// Init
initPlaza();
// Default 2 upgrades as per your screenshot
addUpgradeRow(0,1,42,1); // PARK -> VG 42+1
addUpgradeRow(1,2,2,0);  // VG -> NAM 2+0
calc();
</script>
</body>
</html>
