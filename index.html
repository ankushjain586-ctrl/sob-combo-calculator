<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOB coMboS calculator</title>
<style>
body{margin:0;background:#eef2ff;font-family:system-ui;padding:10px}
.top{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.btn{border:none;border-radius:12px;padding:10px 14px;font-weight:700;color:#fff;font-size:13px;cursor:pointer}
.green{background:#00b050}.purple{background:#7b5cff}.orange{background:#ff8a00}.darkblue{background:#0047cc}
.hi-row{display:flex;align-items:center;gap:8px;margin:10px 0}
.hi-row input{flex:1;background:#fff;border:none;border-radius:20px;padding:10px 16px;text-align:center;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.blue{background:#0055ff;color:#fff;border-radius:20px;padding:10px 14px}
.info{background:#fff;border-radius:18px;padding:12px;text-align:center;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.06);font-weight:600;display:none}
.title{font-size:26px;font-weight:800;text-align:center;margin:14px 0}
.input{width:100%;background:#fff;border:none;border-radius:18px;padding:14px 16px;margin:8px 0;box-shadow:0 2px 8px rgba(0,0,0,.06);font-size:15px;box-sizing:border-box}
.card{background:#fff;border-radius:22px;padding:16px 18px;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.row{display:flex;justify-content:space-between;padding:8px 0;font-weight:600}
.total-row{border-top:2px solid #ddd;margin-top:8px;padding-top:12px}
.total-pill{border:2px solid #ffcc00;border-radius:18px;padding:6px 18px;font-weight:800}
.actions{display:flex;justify-content:center;gap:10px;margin:14px 0;flex-wrap:wrap}
.save{background:#0047cc;border-radius:22px;padding:12px 20px}.reset{background:#ff8a00;border-radius:22px;padding:12px 20px}.print{background:#00b050;border-radius:22px;padding:12px 20px}
.table-wrap{background:#fff;border-radius:18px;padding:12px;margin:12px 0;overflow:auto;box-shadow:0 2px 8px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ddd;padding:6px 8px;text-align:center}th{background:#eef2ff}
.del{color:#fff;background:#ff3b3b;border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div class="top">
<button class="btn green" onclick="exportExcel()">📥 Excel</button>
<button class="btn purple" onclick="filterUserwise()">Userwise</button>
<button class="btn orange" onclick="printAll()">Print All</button>
<button class="btn darkblue" onclick="showAll()">Show All</button>
</div>
<div class="hi-row"><span>🌞</span><b>Hi,</b><input id="username" placeholder="Enter Username"><button class="btn blue" onclick="loadLive()">Load</button></div>
<select class="input" id="userListDropdown" onchange="selectUserFromList()"><option value="">-- All Users List - Select Any User --</option></select>
<div class="info" id="infoBar"><b id="uName"></b> ke <span id="userCount">0</span> SOB | Total: <span id="totalCount">0</span> | Users: <span id="allUsersCount">0</span></div>
<div class="title">SOB coMboS calculator</div>
<select class="input" id="comboSel" onchange="calc()"><option value="">Select Combo</option><option value="0">Explorer Combo - 299/209</option><option value="1">Eco Adventure Combo - 397/307</option><option value="2">Eco Fun Combo - 398/308</option><option value="3">Snow Adventure Combo - 425/335</option><option value="4">Aastha Combo - 570/500</option><option value="5">Adventure Combo - 699</option><option value="6">Namah Combo - 700/525</option><option value="7">Viewing Fun Combo - 775/585</option><option value="8">Symbolic Play Combo - 769/579</option><option value="9">Ultimate Play Combo - 889/799</option><option value="10">Delight Combo - 925/835</option><option value="11">Mini Blast Combo - 969/779</option><option value="12">All in fun Combo - 1100/925</option><option value="13">Divine Rush Combo - 1550/975</option><option value="14">Ultimate Mega Combo - 4249</option></select>
<input class="input" id="adults" type="number" placeholder="No. of Adults" oninput="calc()">
<input class="input" id="children" type="number" placeholder="No. of Children" oninput="calc()">
<div class="card"><div class="row"><span>TPU</span><span id="tpu">₹ 0</span></div><div class="row"><span>OEPL</span><span id="oepl">₹ 0</span></div><div class="row"><span>PAEPL</span><span id="paepl">₹ 0</span></div><div class="row total-row"><span>TOTAL</span><span class="total-pill" id="total">₹ 0</span></div></div>
<input class="input" id="sobId" placeholder="Enter 6-digit SOB ID" maxlength="6">
<div class="actions"><button class="btn save" onclick="saveSOB()">Save SOB</button><button class="btn print" onclick="printMyDay()">Print My Day</button><button class="btn reset" onclick="resetAll()">Reset</button></div>
<div class="table-wrap" id="reportArea" style="display:none"><h3 id="reportTitle" style="text-align:center"></h3><div style="text-align:center;margin-bottom:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn green" onclick="exportExcel()">Excel</button><button class="btn purple" onclick="printSelectedUser()">Print Selected User</button><button class="btn orange" onclick="printAll()">Print All Users</button><button class="btn darkblue" onclick="window.print()">Print Table</button></div><table id="reportTable"></table></div>
<script>
const API="https://api.npoint.io/86455d8f8fd1e7f18d6c";
const DATA=[[170,80,40,89],[170,80,0,227],[170,80,28,200],[170,80,255,0],[470,400,0,100],[170,0,0,529],[650,475,0,50],[470,280,155,150],[470,280,249,50],[170,80,199,520],[470,380,105,350],[670,480,199,100],[450,275,200,450],[1450,875,0,100],[1500,300,449,2300]];
const NAMES=["Explorer Combo","Eco Adventure Combo","Eco Fun Combo","Snow Adventure Combo","Aastha Combo","Adventure Combo","Namah Combo","Viewing Fun Combo","Symbolic Play Combo","Ultimate Play Combo","Delight Combo","Mini Blast Combo","All in fun Combo","Divine Rush Combo","Ultimate Mega Combo"];
let allData=[]; let selectedUser="";
function calc(){let idx=document.getElementById('comboSel').value;if(idx===""){document.getElementById('tpu').innerText='₹ 0';document.getElementById('oepl').innerText='₹ 0';document.getElementById('paepl').innerText='₹ 0';document.getElementById('total').innerText='₹ 0';return {tot:0};}idx=parseInt(idx);let d=DATA[idx];let a=parseInt(document.getElementById('adults').value)||0;let c=parseInt(document.getElementById('children').value)||0;let tpu=(a*d[0])+(c*d[1]);let oepl=(a+c)*d[2];let paepl=(a+c)*d[3];let tot=tpu+oepl+paepl;document.getElementById('tpu').innerText='₹ '+tpu;document.getElementById('oepl').innerText='₹ '+oepl;document.getElementById('paepl').innerText='₹ '+paepl;document.getElementById('total').innerText='₹ '+tot;return {tot,tpu,oepl,paepl,a,c,idx};}
async function loadLive(){let user=document.getElementById('username').value.trim();if(!user){alert('Username daalo');return;}document.getElementById('uName').innerText=user;selectedUser=user;try{let r=await fetch(API);allData=await r.json();if(!Array.isArray(allData))allData=[];document.getElementById('userCount').innerText=allData.filter(x=>x.user.toLowerCase()===user.toLowerCase()).length;document.getElementById('totalCount').innerText=allData.length;let uniqueUsers=[...new Set(allData.map(x=>x.user))];document.getElementById('allUsersCount').innerText=uniqueUsers.length;document.getElementById('infoBar').style.display='block';updateUserDropdown();showAll();}catch(e){alert('Load fail');}}
function updateUserDropdown(){let uniqueUsers=[...new Set(allData.map(x=>x.user))].sort();let dd=document.getElementById('userListDropdown');dd.innerHTML='<option value="">-- All Users List - Select Any User --</option>';uniqueUsers.forEach(u=>{let opt=document.createElement('option');opt.value=u;opt.innerText=`${u} (${allData.filter(x=>x.user===u).length} SOBs)`;dd.appendChild(opt);});}
function selectUserFromList(){let val=document.getElementById('userListDropdown').value;if(!val)return;document.getElementById('username').value=val;selectedUser=val;filterUserwise();}
async function saveSOB(){let user=document.getElementById('username').value.trim();if(!user){alert('Username daalo');return;}let sobId=document.getElementById('sobId').value;if(sobId.length!==6){alert('6-digit SOB ID');return;}let c=calc();if(c.tot===0){alert('Combo + A/C daalo');return;}let rec={id:Date.now().toString(),user:user,sobId:sobId,combo:NAMES[c.idx],adults:c.a,children:c.c,tpu:c.tpu,oepl:c.oepl,paepl:c.paepl,total:c.tot,date:new Date().toLocaleString(),day:new Date().toLocaleDateString()};allData.push(rec);await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(allData)});loadLive();document.getElementById('sobId').value='';alert('Saved!');}
function resetAll(){document.getElementById('adults').value='';document.getElementById('children').value='';document.getElementById('sobId').value='';document.getElementById('comboSel').selectedIndex=0;calc();}
function showAll(){if(allData.length===0){alert('Pehle Load karo');return;}document.getElementById('reportArea').style.display='block';document.getElementById('reportTitle').innerText=`All Users Report - Total ${allData.length} SOBs`;let html='<tr><th>User</th><th>SOB ID</th><th>Combo</th><th>A/C</th><th>Total</th><th>Date</th><th>Delete</th></tr>';allData.slice().reverse().forEach(r=>{html+=`<tr><td><b>${r.user}</b></td><td>${r.sobId}</td><td>${r.combo}</td><td>${r.adults}/${r.children}</td><td>₹${r.total}</td><td>${r.date}</td><td><button class="del" onclick="deleteSOB('${r.id}')">Delete</button></td></tr>`;});document.getElementById('reportTable').innerHTML=html;}
function filterUserwise(){let user=(document.getElementById('username').value.trim()||selectedUser);if(!user){alert('Username daalo ya list se select karo');return;}if(allData.length===0){alert('Load karo');return;}selectedUser=user;let filtered=allData.filter(r=>r.user.toLowerCase()===user.toLowerCase());document.getElementById('reportArea').style.display='block';document.getElementById('reportTitle').innerText=`${user} - ${filtered.length} SOBs`;let html='<tr><th>SOB ID</th><th>Combo</th><th>A/C</th><th>Total</th><th>Date</th><th>Delete</th></tr>';let grand=0;filtered.slice().reverse().forEach(r=>{grand+=r.total;html+=`<tr><td>${r.sobId}</td><td>${r.combo}</td><td>${r.adults}/${r.children}</td><td>₹${r.total}</td><td>${r.date}</td><td><button class="del" onclick="deleteSOB('${r.id}')">Delete</button></td></tr>`;});html+=`<tr><th colspan="3">Grand Total</th><th colspan="3">₹${grand}</th><th></th></tr>`;document.getElementById('reportTable').innerHTML=html;}
async function deleteSOB(id){if(!confirm('Delete?'))return;allData=allData.filter(r=>r.id!==id);await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(allData)});loadLive();}
function printMyDay(){filterUserwise();setTimeout(()=>printSelectedUser(),500);}
function printSelectedUser(){let user=selectedUser||document.getElementById('username').value.trim();if(!user){alert('User select karo');return;}let filtered=allData.filter(r=>r.user.toLowerCase()===user.toLowerCase());if(filtered.length===0){alert('No data');return;}let w=window.open('','','width=600,height=800');let html=`<html><head><title>${user} Report</title><style>body{font-family:system-ui;padding:15px} table{width:100%;border-collapse:collapse} th,td{border:1px solid #000;padding:6px;text-align:center;font-size:12px} th{background:#eee}</style></head><body><h2 style="text-align:center">SOB Report - ${user}</h2><p style="text-align:center">${new Date().toLocaleString()} | Total: ${filtered.length}</p><hr><table><tr><th>SOB ID</th><th>Combo</th><th>A/C</th><th>TPU</th><th>OEPL</th><th>PAEPL</th><th>Total</th><th>Time</th></tr>`;let grand=0;filtered.forEach(r=>{html+=`<tr><td>${r.sobId}</td><td>${r.combo}</td><td>${r.adults}/${r.children}</td><td>₹${r.tpu}</td><td>₹${r.oepl}</td><td>₹${r.paepl}</td><td>₹${r.total}</td><td>${r.date}</td></tr>`;grand+=r.total;});html+=`</table><h3 style="text-align:right">Grand Total: ₹${grand}</h3><center><button onclick="window.print()">🖨️ Print</button></center></body></html>`;w.document.write(html);w.document.close();}
function printAll(){if(allData.length===0){alert('Load karo');return;}let w=window.open('','','width=700,height=900');let html=`<html><head><title>All Users Report</title><style>body{font-family:system-ui;padding:15px} table{width:100%;border-collapse:collapse} th,td{border:1px solid #000;padding:5px;text-align:center;font-size:11px} th{background:#eee}</style></head><body><h2 style="text-align:center">SOB All Users Report</h2><p style="text-align:center">${new Date().toLocaleString()} | Total: ${allData.length}</p><hr><table><tr><th>User</th><th>SOB ID</th><th>Combo</th><th>A/C</th><th>Total</th><th>Date</th></tr>`;let grand=0;allData.forEach(r=>{html+=`<tr><td>${r.user}</td><td>${r.sobId}</td><td>${r.combo}</td><td>${r.adults}/${r.children}</td><td>₹${r.total}</td><td>${r.date}</td></tr>`;grand+=r.total;});html+=`</table><h3 style="text-align:right">Grand Total: ₹${grand}</h3><center><button onclick="window.print()">🖨️ Print All</button></center></body></html>`;w.document.write(html);w.document.close();}
function exportExcel(){if(allData.length===0){alert('Load karo');return;}let csv="User Name,SOB ID,Combo,Adults,Children,TPU,OEPL,PAEPL,Total,Date\n";allData.forEach(r=>{csv+=`"${r.user}","${r.sobId}","${r.combo}",${r.adults},${r.children},${r.tpu},${r.oepl},${r.paepl},${r.total},"${r.date}"\n`;});let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`SOB_Report_${new Date().toLocaleDateString().replaceAll('/','-')}.csv`;a.click();}
calc();
</script>
</body>
</html>
